let overlayMode=null;
const OVMODES=[
  {id:'',name:'Desligado',col:null},{id:'pollution',name:'Poluição',col:'#d95f5f'},
  {id:'happy',name:'Felicidade',col:'#2f9e6e'},{id:'density',name:'População',col:'#5f8fc9'},
  {id:'traffic',name:'Trânsito',col:'#e2844f'},{id:'edu',name:'Educação',col:'#c9a44f'},
  {id:'health',name:'Saúde',col:'#6fb87a'},{id:'sec',name:'Segurança',col:'#7c88c9'},
  {id:'nature',name:'Natureza',col:'#5fae7c'},{id:'zones',name:'Zonas',col:'#7c8a90'}];
const COV_COL={edu:'#c9a44f',health:'#6fb87a',sec:'#7c88c9'};
function drawOverlay(){
  const g=ovCanvas.getContext('2d');
  g.clearRect(0,0,GW,GH);
  g.globalAlpha=1;
  const fill=(x,z,hex,a)=>{g.globalAlpha=clamp(a,0,1);g.fillStyle=hex;g.fillRect(x,z,1,1)};
  if(overlayMode==='zones'){
    for(let z=0;z<GH;z++)for(let x=0;x<GW;x++){
      const v=state.zones[idx(x,z)];
      if(v){const zc=ZONES.find(q=>q.code===v);
        if(zc)fill(x,z,'#'+zc.col.toString(16).padStart(6,'0'),.55)}
    }
  }else if(overlayMode==='nature'){
    for(const b of state.buildings){
      const d=B[b.type];
      if(d.green>0||d.cat==='fun'||d.cat==='nat'){
        const[rw,rh]=rotSize(d.size[0],d.size[1],b.rot);
        for(let dx=0;dx<rw;dx++)for(let dz=0;dz<rh;dz++)fill(b.cx+dx,b.cz+dz,'#5fae7c',.4+d.green*.08);
      }
    }
    for(const o of state.overlays)fill(o.cx,o.cz,'#5fae7c',.6);
  }else if(overlayMode==='traffic'){
    let mx=1;for(let i=0;i<trafficGrid.length;i++)mx=Math.max(mx,trafficGrid[i]);
    for(let z=0;z<GH;z++)for(let x=0;x<GW;x++){
      const v=trafficGrid[idx(x,z)];
      if(v>.05)fill(x,z,v>mx*.5?'#d95f5f':'#e2844f',v/mx*.85);
    }
  }else if(overlayMode==='pollution'){
    for(let z=0;z<GH;z++)for(let x=0;x<GW;x++){
      const v=C.pol[idx(x,z)];
      if(v>.08)fill(x,z,'#d95f5f',v/6);
    }
  }else if(overlayMode==='density'){
    for(const b of state.buildings){
      const d=B[b.type];if(!d.cap)continue;
      const[rw,rh]=rotSize(d.size[0],d.size[1],b.rot);
      for(let dx=0;dx<rw;dx++)for(let dz=0;dz<rh;dz++)fill(b.cx+dx,b.cz+dz,'#5f8fc9',clamp(d.cap/40,.25,.9));
    }
  }else if(overlayMode==='happy'){
    for(let z=0;z<GH;z++)for(let x=0;x<GW;x++){
      const p=C.pol[idx(x,z)];
      const s=state.happy/100-p*.08;
      if(s>.15)fill(x,z,s>.5?'#2f9e6e':'#c9c44f',s*.8);
    }
  }else if(COV_COL[overlayMode]){
    for(const b of state.buildings){
      const d=B[b.type];
      if(d.cov&&d.cov.t===overlayMode){
        const r=d.cov.r;
        for(let z=Math.max(0,b.cz-r);z<=Math.min(GH-1,b.cz+r);z++)
          for(let x=Math.max(0,b.cx-r);x<=Math.min(GW-1,b.cx+r);x++){
            const dd=Math.hypot(x-b.cx,z-b.cz);
            if(dd<=r)fill(x,z,COV_COL[overlayMode],clamp(1-dd/r*.6,.25,.9));
          }
      }
    }
  }
  ovTex.needsUpdate=true;
}

  const willOpen=open!==undefined?open:!p.classList.contains('open');
  p.classList.toggle('open',willOpen);
  $('btnBuild').classList.toggle('on',willOpen);
  if(willOpen){if(mode!=='IDLE')cancelMode();renderTabs();renderItems()}

function openModal(title,icon,bodyHTML,actions,sub=''){
  $('mTitle').innerHTML=ic(icon)+title;
  $('mSub').textContent=sub;
  $('mBody').innerHTML=bodyHTML;
  const a=$('mActs');a.innerHTML='';
  for(const x of actions){
    const b=document.createElement('button');
    b.textContent=x.label;b.className=x.cls||'';
    b.onclick=()=>{AudioSys.click();if(x.fn)x.fn();closeModal()};
    a.appendChild(b);
  }
  $('modal').classList.add('open');
}

    [{label:'Cancelar'},{label:okLabel,cls:'danger',fn}]);

  const f=clamp(val/max,0,1);
  const col=(f>.6)!==!!inv?(inv?'var(--bad)':'var(--good)'):(inv?'var(--good)':'var(--bad)');

  '<div class="bar"><i style="width:'+(f*100)+'%;background:'+col+'"></i></div></div>';
};

function biggestCluster(){
  if(!state.buildings.length)return{x:0,z:0};
  let sx=0,sz=0;for(const b of state.buildings){sx+=cellX(b.cx);sz+=cellZ(b.cz)}
  return{x:sx/state.buildings.length,z:sz/state.buildings.length};
}

  state.tutStep=0;

  if(state.tutStep<0||state.tutStep>=TUT.length||!state.tutBase)return;
  if(TUT[state.tutStep].done()){
    state.tutStep++;

      $('tut').classList.remove('open');
      notify('star','Tutorial concluído','A cidade é sua agora. Faça-a florescer!','gold');

   23. ENTRADA — câmera touch dedicada + mouse + teclado
============================================================ */
const el=renderer.domElement;
const _up=new THREE.Vector3(0,1,0),_fwd=new THREE.Vector3(),_right=new THREE.Vector3();
let pDown=false,pStart={x:0,y:0},pMoved=false,pTime=0,pBtn=0,paint=false,pinched=false;
let roadDragCell=null,roadDragMoved=false,lotDragStart=null,lotDragEnd=null;
const ptrs=new Map();
/* estado do gesto de 2 dedos */
const tg={init:false,d:0,a:0,mx:0,my:0};
/* último toque para pan de 1 dedo */
const tl={x:0,y:0};

function tcPan(dx,dy){
  const dist=camera.position.distanceTo(controls.target);
  const wpp=2*dist*Math.tan(camera.fov*Math.PI/360)/innerHeight;
  camera.getWorldDirection(_fwd);_fwd.y=0;
  if(_fwd.lengthSq()<1e-6)_fwd.set(0,0,-1);
  _fwd.normalize();
  _right.crossVectors(_fwd,_up).normalize();
  const mx=-dx*wpp*1.1,my=dy*wpp*1.1;
  controls.target.addScaledVector(_right,mx);
  controls.target.addScaledVector(_fwd,my);
  camera.position.addScaledVector(_right,mx);
  camera.position.addScaledVector(_fwd,my);
  controls.target.x=clamp(controls.target.x,-GW,GW);
  controls.target.z=clamp(controls.target.z,-GH,GH);
}
function cellFromEvent(e){
  pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObject(rayPlane);
  if(!hits.length)return null;
  const cx=Math.floor((hits[0].point.x+GW*CELL/2)/CELL);
  const cz=Math.floor((hits[0].point.z+GH*CELL/2)/CELL);
  if(!inMap(cx,cz))return null;
  return{cx,cz};
}
function paintZone(e){
  const c=cellFromEvent(e);
  if(!c)return;
  if(!strokeUndo){pushUndo();strokeUndo=true}
  const z=place.brush;
  if(z&&!freeCells(c.cx,c.cz,1,1,0))return;
  if(z&&isWater(c.cx,c.cz))return;
  setZoneCell(c.cx,c.cz,z);
  if(!paintZone._t||performance.now()-paintZone._t>95){paintZone._t=performance.now();AudioSys.zone()}
}
function placeRoadCell(cx,cz){
  const cellKey=key(cx,cz);
  if(roadCells.has(cellKey)||!inMap(cx,cz)||isWater(cx,cz))return;
  place.cx=cx;place.cz=cz;updateGhost();
  if(place.valid&&state.money>=B[place.type].cost){confirmPlace();roadDragMoved=true}
}
function paintRoadSegment(from,to,onCell){
  let x=from.cx,z=from.cz;
  const dx=Math.abs(to.cx-x),dz=Math.abs(to.cz-z),sx=x<to.cx?1:-1,sz=z<to.cz?1:-1;
  let err=dx-dz;
  onCell(x,z);
  while(x!==to.cx||z!==to.cz){
    const prevX=x,prevZ=z,e2=err*2;
    if(e2>-dz){err-=dz;x+=sx}
    if(e2<dx){err+=dx;z+=sz}
    if(x!==prevX&&z!==prevZ)onCell(x,prevZ);
    onCell(x,z);
  }
  roadDragCell={cx:to.cx,cz:to.cz};
}
el.addEventListener('contextmenu',e=>e.preventDefault());
el.addEventListener('dblclick',e=>{
  if(mode!=='IDLE')return;
  const citizen=pickCitizen(e);
  if(citizen){focusCitizen(citizen);return}
  const p=pickObject(e);if(p){if(p.k==='b')focusOn(p.k,p.ref);else openCtx(p.k,p.ref)}
});
el.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  pDown=true;pMoved=false;pTime=performance.now();pBtn=e.button;
  strokeUndo=false;
  roadDragCell=null;roadDragMoved=false;
  if(e.pointerType==='mouse')hoverBox.visible=false;
  if(e.pointerType!=='mouse'&&ptrs.size===2){
    const v=[...ptrs.values()];
    tg.d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);
    tg.a=Math.atan2(v[1].y-v[0].y,v[1].x-v[0].x);
    tg.mx=(v[0].x+v[1].x)/2;tg.my=(v[0].y+v[1].y)/2;
    tg.init=true;pinched=true;
    return;
  }
  if(ptrs.size>1)return;
  pStart={x:e.clientX,y:e.clientY};
  tl.x=e.clientX;tl.y=e.clientY;
  if(mode==='LOT'){
    lotDragStart=cellFromEvent(e);lotDragEnd=lotDragStart;
    return;
  }
  if(e.pointerType==='mouse'&&(mode==='BUILD'||mode==='EDIT')&&e.button===0){
    const c=cellFromEvent(e);
    if(c&&(c.cx!==place.cx||c.cz!==place.cz)){place.cx=c.cx;place.cz=c.cz;updateGhost()}
    if(mode==='BUILD'&&B[place.type]&&B[place.type].road&&c)roadDragCell=c;
    return;
  }
  if(e.pointerType!=='mouse'){
    if(mode==='BUILD'||mode==='EDIT'){
      const c=cellFromEvent(e);
      if(c&&(c.cx!==place.cx||c.cz!==place.cz)){place.cx=c.cx;place.cz=c.cz;updateGhost()}
      if(mode==='BUILD'&&B[place.type]&&B[place.type].road&&c)roadDragCell=c;
    }else if(mode==='ZONE'){
      paint=true;paintZone(e);
    }
    /* IDLE: pan de 1 dedo começa aqui (ver pointermove) */
  }
});
el.addEventListener('pointermove',e=>{
  const pt=ptrs.get(e.pointerId);
  if(pt){pt.x=e.clientX;pt.y=e.clientY}
  /* 2 dedos: pinch zoom + rotação por torção + pan pelo midpoint */
  if(e.pointerType!=='mouse'&&ptrs.size===2){
    const v=[...ptrs.values()];
    const d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);
    const ang=Math.atan2(v[1].y-v[0].y,v[1].x-v[0].x);
    const mx=(v[0].x+v[1].x)/2,my=(v[0].y+v[1].y)/2;
    if(tg.init){
      let da=ang-tg.a;
      if(da>Math.PI)da-=2*Math.PI;
      if(da<-Math.PI)da+=2*Math.PI;
      if(Math.abs(da)>1e-4){
        const off=camera.position.clone().sub(controls.target);
        off.applyAxisAngle(_up,da);
        camera.position.copy(controls.target).add(off);
      }
      if(tg.d>0&&d>0){
        const off=camera.position.clone().sub(controls.target);
        off.setLength(clamp(off.length()*tg.d/d,controls.minDistance,controls.maxDistance));
        camera.position.copy(controls.target).add(off);
      }
      tcPan(mx-tg.mx,my-tg.my);
    }
    tg.d=d;tg.a=ang;tg.mx=mx;tg.my=my;tg.init=true;
    pMoved=true;pinched=true;
    return;
  }
  if(Math.hypot(e.clientX-pStart.x,e.clientY-pStart.y)>9)pMoved=true;
  if(e.pointerType!=='mouse'&&(mode==='IDLE'||mode==='BULL')&&pDown&&ptrs.size===1){
    tcPan(e.clientX-tl.x,e.clientY-tl.y);
    tl.x=e.clientX;tl.y=e.clientY;
    return;
  }
  if(e.pointerType==='mouse'&&(mode==='IDLE'||mode==='BULL')&&!pDown)updateHover(e);
  if(mode==='BUILD'||mode==='EDIT'){
    const track=e.pointerType==='mouse'||(pDown&&ptrs.size===1&&!pinched);
    if(track){
      const c=cellFromEvent(e);
      if(c&&(c.cx!==place.cx||c.cz!==place.cz)){
        if(mode==='BUILD'&&pDown&&ptrs.size===1&&!pinched&&B[place.type]&&B[place.type].road){
          paintRoadSegment(roadDragCell||{cx:place.cx,cz:place.cz},c,placeRoadCell);
        }else{place.cx=c.cx;place.cz=c.cz;updateGhost()}
      }
    }
  }else if(mode==='LOT'&&pDown&&lotDragStart){
    const c=cellFromEvent(e);
    if(c)lotDragEnd=c;
  }else if(mode==='ZONE'&&paint)paintZone(e);
});
/* ---- seleção por raio + realce ao passar o cursor ---- */
function pickObject(e){
  pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects([...secGroups,lotGroup],true);
  if(!hits.length)return null;
  let obj=hits[0].object,bid=null,oid=null,roadCell=null,lotId=null;
  while(obj){
    if(obj.userData){
      if(obj.userData.bid)bid=obj.userData.bid;
      if(obj.userData.oid)oid=obj.userData.oid;
      if(obj.userData.lotId)lotId=obj.userData.lotId;
      if(obj.userData.road&&obj.userData.cx!==undefined)roadCell=[obj.userData.cx,obj.userData.cz];
    }
    obj=obj.parent;
  }
  if(lotId){const lot=state.lots.find(item=>item.id===lotId);if(lot&&lot.status==='available')return{k:'lot',ref:lot}}
  if(oid){const o=state.overlays.find(x=>x.id===oid);if(o)return{k:'o',ref:o}}
  if(bid){const b=state.buildings.find(x=>x.id===bid);if(b)return{k:'b',ref:b}}
  if(roadCell){const b=findAt(roadCell[0],roadCell[1]);if(b)return{k:'b',ref:b}}
  return null;
}
function pickCitizen(e){
  pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(peopleGroup.children,true);
  for(const hit of hits){
    let root=hit.object;
    while(root.parent&&root.parent!==peopleGroup)root=root.parent;
    const citizen=citizens.find(c=>c.mesh===root&&c.mesh.visible);
    if(citizen)return citizen;
  }
  return null;
}
const hoverBox=(()=>{
  const g=new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1));
  const l=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x2f9e6e,transparent:true,opacity:.95}));
  l.visible=false;l.renderOrder=5;scene.add(l);return l;
})();
const _hb=new THREE.Box3();
let hoverTick=0;
function showHover(pick,bad){
  if(!pick){hoverBox.visible=false;return}
  const mesh=pick.k==='b'?bMeshes.get(pick.ref.id):pick.k==='lot'?lotMeshes.get(pick.ref.id):ovMeshes.get(pick.ref.id);
  if(!mesh){hoverBox.visible=false;return}
  _hb.setFromObject(mesh);
  if(_hb.isEmpty()){hoverBox.visible=false;return}
  const s=_hb.getSize(new THREE.Vector3()),c=_hb.getCenter(new THREE.Vector3());
  hoverBox.position.copy(c);
  hoverBox.scale.set(s.x+.14,s.y+.14,s.z+.14);
  hoverBox.material.color.set(bad?0xd95f5f:0x2f9e6e);
  hoverBox.visible=true;
}
function updateHover(e){
  hoverTick--;if(hoverTick>0)return;hoverTick=4;
  showHover(pickObject(e),mode==='BULL');
}
function endPointer(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size===0){tg.init=false;pinched=false}
  if(ptrs.size<2)tg.init=false;
  pDown=false;paint=false;
  const quick=performance.now()-pTime<400&&!pMoved&&!pinched;
  if(pBtn===2&&quick&&mode!=='IDLE'){cancelMode();return}
  if(mode==='LOT'&&e.button===0&&ptrs.size===0){
    const lot=lotDragStart&&lotDragEnd?createLotFromRect(lotDragStart,lotDragEnd):null;
    lotDragStart=null;lotDragEnd=null;cancelMode();
    if(lot)openCtx('lot',lot);
    return;
  }
  if((mode==='BUILD'||mode==='EDIT')&&e.button===0&&ptrs.size===0){
    if(!pinched&&!(mode==='BUILD'&&B[place.type]&&B[place.type].road&&roadDragMoved))confirmPlace();
    roadDragCell=null;roadDragMoved=false;
    return;
  }
  if(mode==='BULL'&&quick&&e.button===0&&ptrs.size===0){
    const p=pickObject(e);
    if(p){AudioSys.click();if(p.k==='b')sellSelected(p.ref);else if(p.k==='o')sellOverlay(p.ref);else notify('home','Lote protegido','Construa ou entre no lote pelo menu da parcela.')}
    else AudioSys.err();
    updateHover(e);
    return;
  }
  if(mode==='IDLE'&&quick&&e.button===0){
    const p=pickObject(e);
    if(p){AudioSys.click();openCtx(p.k,p.ref);return}
    exitCtx();
  }
}

const keys={};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(document.activeElement&&(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA')){keys[k]=false;return}
  keys[k]=true;
  if((e.ctrlKey||e.metaKey)&&(k==='z'||k==='y')){
    e.preventDefault();
    if(k==='y'||e.shiftKey)doRedo();else doUndo();
    return;
  }

  if(k==='escape'){cancelMode();exitCtx();buildPanelToggle(false);closeModal();$('ovPop').classList.remove('open');$('camPop').classList.remove('open')}
  if(k==='enter'&&(mode==='BUILD'||mode==='EDIT'))confirmPlace();

  if(k==='x'&&mode==='IDLE')enterBull();
  if(k==='g')gridHelper.visible=!gridHelper.visible;

      exitSel();
      confirmModal('Demolir construção?','Remover esta construção?','Demolir',()=>sellSelected(ref));

      exitSel();
      confirmModal('Remover decoração?','Remover esta decoração?','Remover',()=>sellOverlay(ref));

  }
  if(k==='+'||k==='='){const off=camera.position.clone().sub(controls.target);off.setLength(clamp(off.length()*.88,8,95));camera.position.copy(controls.target).add(off)}
  if(k==='-'){const off=camera.position.clone().sub(controls.target);off.setLength(clamp(off.length()*1.14,8,95));camera.position.copy(controls.target).add(off)}
});

function applyQuality(){
  const q=state.settings.quality==='auto'?(isMobile?'low':'medium'):state.settings.quality;
  renderer.setPixelRatio(q==='low'?1:q==='medium'?Math.min(devicePixelRatio,1.5):Math.min(devicePixelRatio,2));
  const sz=q==='ultra'||q==='high'?2048:q==='medium'?1024:512;
  if(sun.shadow.mapSize.x!==sz){sun.shadow.mapSize.set(sz,sz);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
  sun.castShadow=state.settings.shadows&&q!=='low';
  /* sombras recalculadas só a cada poucos quadros (custo alto de render) */
  renderer.shadowMap.autoUpdate=false;
  renderer.shadowMap.needsUpdate=true;
}
/* qualidade adaptativa por FPS (só em modo auto) */
let adaptStep=0,fpsA=0,fpsC=0;
function updateAdaptive(dt){
  if(state.settings.quality!=='auto')return;
  fpsA+=dt;fpsC++;
  if(fpsA<2)return;
  const fps=fpsC/fpsA;fpsA=0;fpsC=0;
  if(fps<26&&adaptStep<2){
    adaptStep++;
    if(adaptStep===1)renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
    else{
      renderer.setPixelRatio(1);
      sun.shadow.mapSize.set(512,512);
      if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}
    }
  }
}

function hydrateAll(){
  for(const lot of state.lots||[])if(lot.status==='available')releaseLotCells(lot);
  let mx=0;
  for(const b of state.buildings){
    const d=B[b.type];
    if(!inMap(b.cx,b.cz))continue;
    if(d.road)setRoad(b.cx,b.cz,d.road);
    else{
      const g=buildModel(d,hashStr(b.id),b.lvl);
      meshTo(g,b.cx,b.cz,d.size[0],d.size[1],b.rot);
      g.userData.bid=b.id;
      const[rw,rh]=rotSize(d.size[0],d.size[1],b.rot);
      secAdd(g,cellX(b.cx)+(rw-1)*CELL/2,cellZ(b.cz)+(rh-1)*CELL/2);
      bMeshes.set(b.id,g);
    }
    if(!d.onRoad)markCells(b.cx,b.cz,d.size[0],d.size[1],b.rot,b.id);
    mx=Math.max(mx,parseInt((b.id||'b0').slice(1))||0);
  }
  for(const o of state.overlays){
    if(!inMap(o.cx,o.cz)||isWater(o.cx,o.cz))continue;
    const g=buildModel(B[o.type],hashStr(o.id),1);
    g.position.set(cellX(o.cx),0,cellZ(o.cz));
    g.userData={oid:o.id};
    secAdd(g,cellX(o.cx),cellZ(o.cz));
    ovMeshes.set(o.id,g);
    mx=Math.max(mx,parseInt((o.id||'o0').slice(1))||0);
  }
  state.seq=Math.max(state.seq,mx+1);
  hydrateZones();
  rebuildCaches();
  for(const lot of state.lots||[])if(lot.status==='available')reserveLotCells(lot);
}

/* ============================================================
   25. LOOP PRINCIPAL
============================================================ */
let prev=performance.now(),introAngle=0,saveAcc=0,frame=0,windT=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-prev)/1000);prev=now;
  frame++;
  const gdt=dt*gameSpeed;
  /* vento nas árvores (continua mesmo pausado — cidade viva) */
  windT+=dt;
  const wAmp=state.weather==='storm'?.08:state.weather==='rain'?.045:.02;
  if((frame&1)===0)for(let i=0;i<SECN;i++){
    const g=secGroups[i];
    if(!g.visible)continue;
    const ch=g.children;
    for(let j=0;j<ch.length;j++){
      const t=ch[j];
      if(t.userData&&(t.userData.bid||t.userData.oid||t.userData.road))continue; /* só decoração, nunca construções ou ruas */
      t.rotation.z=Math.sin(windT*1.3+j*.63)*wAmp;
      t.rotation.x=Math.cos(windT*1.1+j*.41)*wAmp*.6;
    }
  }
  updatePops(dt);
  updateCulling(dt);
  updateAdaptive(dt);
  if(!started){
    introAngle+=dt*.06;
    controls.target.set(0,0,0);
    camera.position.set(Math.cos(introAngle)*46,30,Math.sin(introAngle)*46);
    camera.lookAt(0,0,0);
    waterUniforms.uTime.value=now*.001;
    for(const c of clouds){c.position.x+=c.userData.v*dt;if(c.position.x>75)c.position.x=-75}
  }else{
    /* câmera por teclado: proporcional ao zoom */
    const dist=camera.position.distanceTo(controls.target);
    const cs=(5+dist*.85)*dt;
    camera.getWorldDirection(_fwd);_fwd.y=0;
    if(_fwd.lengthSq()<1e-6)_fwd.set(0,0,-1);
    _fwd.normalize();
    _right.crossVectors(_fwd,_up).normalize();
    if(keys['w']){controls.target.addScaledVector(_fwd,cs);camera.position.addScaledVector(_fwd,cs)}
    if(keys['s']){controls.target.addScaledVector(_fwd,-cs);camera.position.addScaledVector(_fwd,-cs)}
    if(keys['a']){controls.target.addScaledVector(_right,-cs);camera.position.addScaledVector(_right,-cs)}
    if(keys['d']){controls.target.addScaledVector(_right,cs);camera.position.addScaledVector(_right,cs)}
    if(keys['q']||keys['e']){
      const off=camera.position.clone().sub(controls.target);
      off.applyAxisAngle(_up,(keys['q']?1:-1)*1.8*dt);
      camera.position.copy(controls.target).add(off);
    }
    controls.target.x=clamp(controls.target.x,-GW,GW);
    controls.target.z=clamp(controls.target.z,-GH,GH);
    if(trackedCitizen){
      if(!trackedCitizen.mesh.parent)trackedCitizen=null;
      else if(!camTween){
        cameraAnchor.set(trackedCitizen.mesh.position.x,trackedCitizen.mesh.position.y+.65,trackedCitizen.mesh.position.z);
        cameraDirection.copy(cameraAnchor).sub(controls.target).multiplyScalar(1-Math.exp(-5*dt));
        controls.target.add(cameraDirection);camera.position.add(cameraDirection);
      }
    }
    if(camTween){
      camTween.t+=dt*1000/camTween.dur;
      const f=camTween.t>=1?1:1-Math.pow(1-camTween.t,3);
      camera.position.lerpVectors(camTween.p0,camTween.p1,f);
      controls.target.lerpVectors(camTween.t0,camTween.t1,f);
      if(camTween.t>=1)camTween=null;
    }
    controls.update();
    if(camera.position.y<1.5)camera.position.y=1.5;
    updateWeatherTime(gdt);
    updateCitizens(gdt);
    updateCars(gdt);
    updateEvents();
    updateOverlayLoop(dt);
    fx.update(gdt);
    AudioSys.music(dt);
    updateClock(dt);
    updateCtx();
    saveAcc+=dt;
    if(saveAcc>30){saveAcc=0;save()}
    if(frame%90===0)for(let i=0;i<trafficGrid.length;i++)trafficGrid[i]*=.92;
  }
  if(signalList.length){
    const ns=(now/8000%2)<1;
    for(const s of signalList){
      s.nsG.visible=ns;s.nsR.visible=!ns;
      s.ewG.visible=!ns;s.ewR.visible=ns;
    }
  }
  renderer.shadowMap.needsUpdate=(frame<5||frame%4===0)&&sun.castShadow;
  renderer.render(scene,camera);
  renderer.shadowMap.needsUpdate=false;
}
