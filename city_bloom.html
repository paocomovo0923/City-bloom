<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f7d58">
<title>CityBloom — Construa. Floresça. Viva.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#22303a; --muted:#5f7076; --paper:rgba(253,251,244,.9);
  --line:rgba(34,48,58,.10); --accent:#2f9e6e; --accent-dk:#25815a; --good:#2f9e6e; --warn:#e2844f; --bad:#d95f5f; --gold:#c9973c;
  --r:18px; --r2:14px; --sh:0 10px 32px rgba(24,44,38,.16); --sh2:0 4px 14px rgba(24,44,38,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ed6b4;color:var(--ink);
  font-family:Nunito,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
#app{position:relative;width:100%;height:100%}
canvas{display:block;outline:none}
svg.ic{width:1.25em;height:1.25em;flex:none;display:block}
#vignette{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 54%,rgba(12,28,22,.30) 100%)}

#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
.topbar{display:flex;align-items:flex-start;gap:.45rem;padding:max(.55rem,env(safe-area-inset-top)) .6rem 0}
.brand{pointer-events:auto;display:flex;align-items:center;gap:.45rem;padding:.4rem .65rem;border-radius:var(--r2);
  background:var(--paper);backdrop-filter:blur(14px);box-shadow:var(--sh)}
.brand .mark{width:1.45rem;height:1.45rem;border-radius:.5rem;background:var(--accent);color:#fff;display:grid;place-items:center}
.brand .mark svg{width:.95rem;height:.95rem}
.brand b{font-family:Fraunces,serif;font-size:.9rem;line-height:1;display:block}
.brand small{display:block;font-size:.52rem;font-weight:800;color:var(--muted);letter-spacing:.06em;margin-top:.12rem}
#stats{display:flex;gap:.3rem;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:auto;max-width:48vw}
#stats::-webkit-scrollbar{display:none}
.stat{pointer-events:auto;flex:none;display:flex;align-items:center;gap:.35rem;padding:.35rem .55rem;border-radius:.75rem;
  background:var(--paper);backdrop-filter:blur(14px);box-shadow:var(--sh)}
.stat svg{color:var(--accent-dk);width:1rem;height:1rem}
.stat .txt{line-height:1}
.stat .k{font-size:.46rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:900}
.stat .v{font-size:.72rem;font-weight:900;margin-top:.08rem;white-space:nowrap}
.stat.happy svg{color:var(--gold)}
.stat .v.warn{color:var(--bad)}
.topbtns{pointer-events:auto;display:flex;gap:.3rem}
.tbtn{width:2rem;height:2rem;border-radius:.75rem;background:var(--paper);backdrop-filter:blur(14px);box-shadow:var(--sh);
  display:grid;place-items:center;color:var(--ink)}
.tbtn:active{transform:scale(.92)}
.tbtn.on{background:var(--accent);color:#fff}

/* ---- zona dos polegares ---- */
.bottom{padding:0 .6rem max(.6rem,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:.5rem}
#leftCol{pointer-events:none;display:flex;flex-direction:column;gap:.35rem;min-width:0;max-width:46vw}
#leftCol>*{pointer-events:auto}
#speedPill{display:flex;gap:.15rem;padding:.2rem;border-radius:99px;background:var(--paper);backdrop-filter:blur(14px);box-shadow:var(--sh)}
#speedPill button{min-width:2.1rem;height:2rem;padding:0 .35rem;border-radius:99px;font-size:.66rem;font-weight:900;color:var(--muted)}
#speedPill button svg{width:1rem;height:1rem;margin:0 auto}
#speedPill button.on{background:var(--accent);color:#fff}
#speedPill button:active{transform:scale(.93)}
#missionChip{display:flex;align-items:center;gap:.4rem;padding:.35rem .55rem;border-radius:var(--r2);background:var(--paper);
  backdrop-filter:blur(14px);box-shadow:var(--sh);font-size:.6rem;font-weight:800;cursor:pointer;max-width:100%}
#missionChip svg{color:var(--gold);flex:none;width:1rem;height:1rem}
#missionChip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#missionChip .p{color:var(--muted);font-weight:900;flex:none}
#lvlCard{padding:.5rem .65rem;border-radius:var(--r2);background:var(--paper);backdrop-filter:blur(14px);box-shadow:var(--sh)}
#lvlCard .row{display:flex;justify-content:space-between;align-items:baseline;font-size:.62rem;font-weight:900}
#lvlCard .row span:last-child{color:var(--muted);font-size:.52rem}
.bar{height:.32rem;background:rgba(34,48,58,.10);border-radius:99px;overflow:hidden;margin-top:.35rem}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s}
#dock{pointer-events:auto;display:flex;flex-direction:column;align-items:flex-end;gap:.4rem;transition:opacity .3s}
#dock.hidden{opacity:0;pointer-events:none}
.dockrow{display:flex;gap:.4rem;justify-content:flex-end}
.dbtn{width:2.7rem;height:2.7rem;border-radius:1rem;background:var(--paper);backdrop-filter:blur(14px);box-shadow:var(--sh);
  display:grid;place-items:center}
.dbtn:active{transform:scale(.92)}
.dbtn.primary{width:3.4rem;height:3.4rem;border-radius:1.25rem;background:var(--accent);color:#fff;box-shadow:0 12px 30px rgba(37,129,90,.42)}
.dbtn.off{opacity:.35;pointer-events:none}

#pausedTag{position:absolute;top:3.6rem;left:50%;transform:translateX(-50%);padding:.3rem .8rem;border-radius:99px;
  background:var(--paper);backdrop-filter:blur(12px);box-shadow:var(--sh);font-size:.6rem;font-weight:900;
  letter-spacing:.14em;color:var(--warn);display:none;pointer-events:none;z-index:21}
#pausedTag.on{display:block}

/* ---- barra de modo ---- */
#modeBar{position:absolute;left:50%;bottom:6.6rem;transform:translate(-50%,140%);display:flex;align-items:center;gap:.4rem;
  padding:.4rem .45rem;border-radius:99px;background:var(--paper);backdrop-filter:blur(14px);box-shadow:var(--sh);
  visibility:hidden;pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s;
  z-index:12;max-width:94vw}
#modeBar.open{transform:translate(-50%,0);visibility:visible;pointer-events:auto;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
#modeHint{font-size:.6rem;font-weight:800;padding:0 .4rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:11rem}
#modeBar button{width:2.6rem;height:2.6rem;border-radius:1rem;background:rgba(34,48,58,.07);display:grid;place-items:center;flex:none}
#modeBar button.ok{background:var(--accent);color:#fff}
#modeBar button.no{background:rgba(217,95,95,.14);color:var(--bad)}

/* ---- painel de construção: abas fixas, cards grandes ---- */
#buildPanel{position:absolute;left:50%;bottom:0;transform:translate(-50%,110%);width:min(96vw,34rem);max-height:64vh;
  background:var(--paper);backdrop-filter:blur(16px);border-radius:var(--r) var(--r) 0 0;box-shadow:0 -12px 44px rgba(20,42,35,.22);
  display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:auto;z-index:14}
#buildPanel.open{transform:translate(-50%,0)}
.phead{display:flex;align-items:center;justify-content:space-between;padding:.7rem .8rem .35rem}
.phead b{font-size:.95rem;font-weight:900}
.xbtn{width:2.1rem;height:2.1rem;border-radius:.75rem;background:rgba(34,48,58,.07);display:grid;place-items:center}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:.25rem;padding:.25rem .7rem .4rem}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.16rem;min-height:3.05rem;
  padding:.35rem .15rem;border-radius:.8rem;background:rgba(34,48,58,.06);
  font-size:.53rem;font-weight:900;color:var(--muted)}
.tab svg{width:1.05rem;height:1.05rem}
.tab.active{background:var(--accent);color:#fff}
#items{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 .7rem .7rem;display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.item{position:relative;padding:.55rem;border-radius:var(--r2);background:#fff;border:1px solid var(--line);text-align:left;
  display:flex;flex-direction:column;gap:.2rem;box-shadow:var(--sh2);min-height:4.7rem}
.item:active{transform:scale(.97)}
.item .em{width:2rem;height:2rem;border-radius:.7rem;display:grid;place-items:center;color:#fff}
.item .em svg{width:1.15rem;height:1.15rem}
.item strong{font-size:.64rem;font-weight:900;line-height:1.15}
.item span{font-size:.55rem;color:var(--muted);font-weight:800}
.item.locked{opacity:.5}
.item.poor{opacity:.62}
.item.poor span{color:var(--bad)}
.item .lock{position:absolute;top:.45rem;right:.5rem;font-size:.5rem;font-weight:900;color:var(--warn)}
.pfoot{padding:.35rem .85rem calc(.55rem + env(safe-area-inset-bottom));font-size:.55rem;color:var(--muted);font-weight:700}

/* ---- popup contextual 3D (estilo Sims) ---- */
#ctx{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:none;flex-direction:column;
  background:var(--paper);backdrop-filter:blur(16px);border-radius:1.05rem;box-shadow:0 12px 38px rgba(20,42,35,.28);
  padding:.45rem .5rem .5rem;z-index:18;pointer-events:auto;min-width:11rem;opacity:0}
#ctx.open{display:flex}
#ctx.flip{transform:translate(-50%,0)}
#ctx .ctxArrow{position:absolute;left:50%;bottom:-6px;width:13px;height:13px;background:var(--paper);
  transform:translateX(-50%) rotate(45deg);border-radius:3px}
#ctx.flip .ctxArrow{bottom:auto;top:-6px}
#ctxHead{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:0 .15rem .35rem;
  border-bottom:1px solid var(--line);margin-bottom:.4rem}
#ctxHead b{font-size:.66rem;line-height:1.1}
#ctxHead small{display:block;font-size:.5rem;color:var(--muted);font-weight:800}
#ctxClose{width:1.7rem;height:1.7rem;border-radius:.6rem;background:rgba(34,48,58,.07);display:grid;place-items:center;flex:none}
#ctxClose svg{width:.9rem;height:.9rem}
#ctxBtns{display:flex;gap:.3rem}
.cbtn{width:2.55rem;height:2.55rem;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.06rem;background:rgba(34,48,58,.07);font-size:.44rem;font-weight:900;color:var(--ink)}
.cbtn svg{width:1.05rem;height:1.05rem}
.cbtn:active{transform:scale(.9)}
.cbtn.up{background:rgba(47,158,110,.16);color:var(--accent-dk)}
.cbtn.dm{background:rgba(217,95,95,.13);color:var(--bad)}

/* ---- notificações / modal ---- */
#notes{position:absolute;top:3.9rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:.35rem;
  align-items:center;z-index:55;pointer-events:none;width:min(92vw,23rem)}
.note{display:flex;gap:.5rem;align-items:center;padding:.5rem .7rem;border-radius:var(--r2);background:var(--paper);
  backdrop-filter:blur(14px);box-shadow:var(--sh);opacity:0;transform:translateY(-8px);transition:.3s;max-width:100%}
.note.show{opacity:1;transform:none}
.note svg{width:1.05rem;height:1.05rem;flex:none;color:var(--accent-dk)}
.note.err svg{color:var(--bad)} .note.gold svg{color:var(--gold)} .note.warn2 svg{color:var(--warn)}
.note .tt{font-size:.64rem;font-weight:900;line-height:1.2}
.note .bd{font-size:.56rem;color:var(--muted);font-weight:700;line-height:1.3}

#modal{position:absolute;inset:0;background:rgba(22,34,29,.38);backdrop-filter:blur(3px);display:none;
  align-items:center;justify-content:center;z-index:60;pointer-events:auto;padding:1rem}
#modal.open{display:flex}
.mcard{width:min(94vw,26rem);max-height:84vh;overflow-y:auto;background:var(--paper);backdrop-filter:blur(18px);
  border-radius:var(--r);padding:1rem calc(1rem + env(safe-area-inset-right)/4) calc(1rem + env(safe-area-inset-bottom)/2);
  box-shadow:0 24px 60px rgba(15,30,25,.3)}
.mcard h3{margin:0 0 .15rem;font-size:1rem;font-weight:900;display:flex;align-items:center;gap:.5rem}
.mcard h3 svg{color:var(--accent-dk)}
.mcard .sub{font-size:.6rem;color:var(--muted);font-weight:800;margin-bottom:.7rem}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.72rem;font-weight:800}
.mrow .lab{display:flex;align-items:center;gap:.5rem;color:var(--muted)}
.mrow .lab svg{color:var(--accent-dk)}
.mrow .pos{color:var(--good)} .mrow .neg{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0 .6rem}
.schip{font-size:.56rem;font-weight:900;padding:.3rem .55rem;border-radius:99px;background:rgba(34,48,58,.06);color:var(--muted)}
.schip b{color:var(--ink)}
.meter{margin:.5rem 0}
.meter .mt{display:flex;justify-content:space-between;font-size:.64rem;font-weight:900;margin-bottom:.22rem}
.meter .mt span:last-child{color:var(--muted)}
.macts{display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap}
.macts button{flex:1;min-width:6rem;padding:.75rem;border-radius:.9rem;font-weight:900;font-size:.72rem;background:rgba(34,48,58,.07)}
.macts .primary{background:var(--accent);color:#fff}
.macts .danger{background:var(--bad);color:#fff}
.seg{display:flex;gap:.3rem;flex-wrap:wrap;margin:.25rem 0 .5rem}
.seg button{padding:.45rem .7rem;border-radius:.7rem;font-size:.62rem;font-weight:900;background:rgba(34,48,58,.07);color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.seglab{font-size:.6rem;font-weight:900;color:var(--muted);margin:.5rem 0 .15rem}
input[type=range]{width:100%;accent-color:var(--accent)}
.mission{display:flex;gap:.6rem;align-items:center;padding:.55rem;border-radius:var(--r2);background:rgba(34,48,58,.05);margin-bottom:.45rem}
.mission .mi{width:2rem;height:2rem;border-radius:.7rem;background:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--sh2)}
.mission .mi svg{width:1rem;height:1rem}
.mission.done{opacity:.55}
.mission.done .mi{background:var(--accent);color:#fff}
.mission b{font-size:.68rem;display:block}
.mission small{font-size:.55rem;color:var(--muted);font-weight:700}
.mission .rw{margin-left:auto;font-size:.6rem;font-weight:900;color:var(--gold);flex:none}

.pop{position:absolute;top:3.4rem;right:.6rem;min-width:11rem;background:var(--paper);backdrop-filter:blur(16px);
  border-radius:var(--r2);box-shadow:var(--sh);padding:.45rem;display:none;flex-direction:column;gap:.2rem;pointer-events:auto;z-index:16;
  max-height:60vh;overflow-y:auto}
.pop.open{display:flex}
.pop button{display:flex;align-items:center;gap:.55rem;padding:.55rem .6rem;border-radius:.7rem;font-size:.64rem;font-weight:800;text-align:left}
.pop button.on{background:var(--accent);color:#fff}
.pop .dot{width:.6rem;height:.6rem;border-radius:99px;flex:none}

#banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;
  text-align:center;transition:.45s cubic-bezier(.2,.8,.2,1);z-index:62}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner .in{padding:1rem 2rem;border-radius:var(--r);background:var(--paper);backdrop-filter:blur(16px);box-shadow:0 18px 50px rgba(20,40,32,.3)}
#banner b{font-family:Fraunces,serif;font-size:1.6rem;color:var(--accent-dk);display:block}
#banner span{font-size:.7rem;font-weight:800;color:var(--muted)}

#tut{position:absolute;top:7.8rem;left:50%;transform:translateX(-50%);width:min(92vw,21rem);display:none;
  background:var(--paper);backdrop-filter:blur(16px);border-radius:var(--r2);box-shadow:var(--sh);padding:.65rem .75rem;
  pointer-events:auto;z-index:19}
#tut.open{display:block}
#tut .st{font-size:.54rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-dk)}
#tut .tx{font-size:.68rem;font-weight:800;margin:.25rem 0 .5rem;line-height:1.4}
#tut .rw{display:flex;gap:.4rem;justify-content:flex-end}
#tut .rw button{font-size:.6rem;font-weight:900;padding:.4rem .7rem;border-radius:.6rem;background:rgba(34,48,58,.07)}

#intro{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:rgba(14,30,24,.34);backdrop-filter:blur(6px);transition:opacity .6s,visibility 0s .6s;pointer-events:auto}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#introCard{text-align:center;padding:2.2rem 2.4rem;border-radius:1.6rem;background:var(--paper);backdrop-filter:blur(20px);
  box-shadow:0 30px 80px rgba(10,25,18,.4);max-width:min(92vw,24rem)}
#introCard .mark{width:4rem;height:4rem;border-radius:1.25rem;background:var(--accent);color:#fff;display:grid;place-items:center;margin:0 auto .9rem}
#introCard .mark svg{width:2.3rem;height:2.3rem}
#introCard h1{font-family:Fraunces,serif;font-size:2.5rem;margin:0;color:var(--ink);letter-spacing:-.02em}
#introCard .tag{font-size:.75rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-dk);margin:.35rem 0 1.6rem}
#introCard .btns{display:flex;flex-direction:column;gap:.5rem}
.ibtn{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.9rem;border-radius:.95rem;font-weight:900;font-size:.85rem;
  background:rgba(34,48,58,.07)}
.ibtn.main{background:var(--accent);color:#fff;box-shadow:0 10px 26px rgba(37,129,90,.4)}
.ibtn:disabled{opacity:.45}
#introCard .ver{font-size:.55rem;color:var(--muted);font-weight:800;margin-top:1.1rem}

@media(min-width:800px){
  #buildPanel{left:1rem;top:4.4rem;bottom:auto;transform:translateX(-120%);width:22rem;max-height:calc(100vh - 9rem);
    border-radius:var(--r)}
  #buildPanel.open{transform:translateX(0)}
  #tabs{grid-template-columns:repeat(7,1fr)}
  .tab{font-size:.5rem;min-height:2.9rem}
  #items{grid-template-columns:1fr 1fr}
  #modeBar{bottom:1.2rem}
  .dbtn:hover,.tbtn:hover{transform:translateY(-2px)}
  #leftCol{max-width:260px}
}
@media(max-width:520px){
  #items{grid-template-columns:repeat(2,1fr)}
  .brand b{font-size:.82rem}
  #stats{max-width:42vw}
  #leftCol{max-width:42vw}
}
</style>
</head>
<body>
<div id="app">
  <div id="world"></div>
  <div id="vignette"></div>

  <div id="hud">
    <div class="topbar">
      <div class="brand">
        <div class="mark" id="brandIcon"></div>
        <div><b>CityBloom</b><small>CONSTRUA. FLORESÇA. VIVA.</small></div>
      </div>
      <div id="stats">
        <div class="stat" id="stMoney"><span class="ic" id="icMoney"></span><div class="txt"><div class="k">Tesouro</div><div class="v">—</div></div></div>
        <div class="stat" id="stBalBox"><span class="ic" id="icBal"></span><div class="txt"><div class="k">Saldo</div><div class="v" id="stBal">—</div></div></div>
        <div class="stat"><span class="ic" id="icPop"></span><div class="txt"><div class="k">População</div><div class="v" id="stPop">—</div></div></div>
        <div class="stat happy"><span class="ic" id="icHappy"></span><div class="txt"><div class="k">Felicidade</div><div class="v" id="stHappy">—</div></div></div>
        <div class="stat"><span class="ic" id="stWIcon"></span><div class="txt"><div class="k" id="stDay">Dia 1</div><div class="v" id="stTime">07:30</div></div></div>
      </div>
      <div class="topbtns">
        <button class="tbtn" id="btnLayers" title="Modos de informação"></button>
        <button class="tbtn" id="btnHome" title="Câmera"></button>
        <button class="tbtn" id="btnLotResidential" title="Desenhar lote residencial"></button>
        <button class="tbtn" id="btnLotCommercial" title="Desenhar lote comercial"></button>
        <button class="tbtn" id="btnHelp" title="Ajuda"></button>
      </div>
    </div>

    <div class="bottom">
      <div id="leftCol">
        <div id="speedPill">
          <button data-s="0" title="Pausar"></button>
          <button data-s="1" class="on">1×</button>
          <button data-s="2">2×</button>
          <button data-s="3">3×</button>
          <button data-s="4">4×</button>
        </div>
        <div id="missionChip"><span class="ic" id="mcIcon"></span><span class="t">—</span><span class="p"></span></div>
        <div id="lvlCard">
          <div class="row"><span id="lvlName">Vila</span><span id="lvlNum">Nível 1</span></div>
          <div class="bar"><i id="lvlBar"></i></div>
        </div>
      </div>
      <div id="dock">
        <div class="dockrow">
          <button class="dbtn" id="btnUndo" title="Desfazer (Ctrl+Z)"></button>
          <button class="dbtn" id="btnRedo" title="Refazer (Ctrl+Y)"></button>

  const mem=new Map();
  return{

    set(k,v){if(ls){try{ls.setItem(k,v);return}catch(e){}}mem.set(k,v)},

  };
})();

function migrateV2(s){
  defaultState();
  state.money=Math.max(2000,s.money??8500);state.pop=Math.max(30,s.pop??120);
  state.day=1;state.t=8;
  for(const b of (s.buildings||[])){
    if(!b||!B[b.type])continue;
    const cx=(b.cx|0)+21,cz=(b.cz|0)+17;
    const d=B[b.type];
    let ok=inMap(cx,cz)&&inMap(cx+d.size[0]-1,cz+d.size[1]-1);
    if(ok&&!d.road&&isWater(cx,cz))ok=false;
    if(ok)state.buildings.push({id:b.id,type:b.type,cx,cz,rot:(b.rot|0)%4,lvl:1,age:0,spent:d.cost});
  }
  notify('info','Cidade migrada','Seu protótipo foi convertido para o CityBloom 2.1.');
}
function loadSave(){
  try{
    const raw=Store.get(KEY);
    if(raw){
      const s=JSON.parse(raw);
      if(!s||typeof s!=='object'||!Array.isArray(s.buildings))return false;
      defaultState();
      Object.assign(state,{money:s.money??9000,pop:s.pop??45,happy:s.happy??70,qol:s.qol??60,tax:s.tax??9,
        day:s.day??1,t:s.t??7.5,weather:s.weather||'sun',seq:s.seq||1,level:s.level||1,
        mission:s.mission||0,tutStep:s.tutStep??-1,tutBase:s.tutBase||null,ach:s.ach||{},
        lots:Array.isArray(s.lots)?s.lots:[],
        stats:{...state.stats,...(s.stats||{})},settings:{...state.settings,...(s.settings||{})}});
      state.buildings=s.buildings.filter(b=>b&&B[b.type]).map(b=>({id:b.id,type:b.type,cx:b.cx|0,cz:b.cz|0,
        rot:(b.rot|0)%4,lvl:clamp(b.lvl||1,1,3),age:b.age||0,spent:b.spent||B[b.type].cost}));
      state.overlays=(s.overlays||[]).filter(o=>o&&B[o.type]&&B[o.type].ov)
        .map(o=>({id:o.id,type:o.type,cx:o.cx|0,cz:o.cz|0}));
      state.lots=Array.isArray(s.lots)?s.lots.map(lot=>({...lot})):[];
      const z=s.zones;
      if(Array.isArray(z)&&z.length===GW*GH)state.zones=Uint8Array.from(z);
      return true;
    }
    const raw2=Store.get(KEY_V2);
    if(raw2){const s=JSON.parse(raw2);if(s&&Array.isArray(s.buildings)){migrateV2(s);return true}}
    return false;
  }catch(e){return false}
}

/* ============================================================
   4b. SETORES ESPACIAIS (frustum + distance culling)
============================================================ */
const SEC_COLS=4,SEC_ROWS=3,SECN=SEC_COLS*SEC_ROWS;
const secGroups=[],secBoxes=[];
const secW=GW*CELL/SEC_COLS,secH=GH*CELL/SEC_ROWS;
for(let i=0;i<SECN;i++){
  const g=new THREE.Group();g.userData.sec=true;scene.add(g);secGroups.push(g);
  secBoxes.push(new THREE.Box3(new THREE.Vector3(1e9,0,1e9),new THREE.Vector3(-1e9,10,-1e9)));
}
function secAdd(mesh,wx,wz){
  const col=clamp(Math.floor((wx+GW*CELL/2)/secW),0,SEC_COLS-1);
  const row=clamp(Math.floor((wz+GH*CELL/2)/secH),0,SEC_ROWS-1);
  const i=row*SEC_COLS+col;
  secGroups[i].add(mesh);
  const b=secBoxes[i];
  b.min.x=Math.min(b.min.x,wx-CELL);b.min.z=Math.min(b.min.z,wz-CELL);
  b.max.x=Math.max(b.max.x,wx+CELL);b.max.z=Math.max(b.max.z,wz+CELL);
  return mesh;
}
function secRemove(mesh){if(mesh&&mesh.parent)mesh.parent.remove(mesh)}
function resetSectors(){
  for(let i=0;i<SECN;i++){
    const g=secGroups[i];
    while(g.children.length)g.remove(g.children[0]);
    secBoxes[i].min.set(1e9,0,1e9);secBoxes[i].max.set(-1e9,10,-1e9);
  }
}
const _frustum=new THREE.Frustum(),_projM=new THREE.Matrix4(),_v3=new THREE.Vector3();
let cullT=0;
function updateCulling(dt){
  cullT-=dt;if(cullT>0)return;cullT=.18;
  camera.updateMatrixWorld();
  _projM.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse);
  _frustum.setFromProjectionMatrix(_projM);
  const cd=state.settings.dist==='low'?95:state.settings.dist==='medium'?150:280;
  const cp=camera.position;
  for(let i=0;i<SECN;i++){
    const b=secBoxes[i];
    if(b.isEmpty()){secGroups[i].visible=false;continue}
    const cx2=(b.min.x+b.max.x)/2,cz2=(b.min.z+b.max.z)/2;
    if(Math.hypot(cp.x-cx2,cp.z-cz2)>cd){secGroups[i].visible=false;continue}
    secGroups[i].visible=_frustum.intersectsBox(b);
  }
}

const matCache=new Map(),geoCache=new Map();
function MAT(hex,o={}){
  const k=hex+'|'+(o.r??.85)+'|'+(o.m||0)+'|'+(o.e||0)+'|'+(o.ei??1)+'|'+(o.t||0);
  if(matCache.has(k))return matCache.get(k);
  const m=new THREE.MeshStandardMaterial({color:hex,roughness:o.r??.85,metalness:o.m||0});
  if(o.e){m.emissive=new THREE.Color(o.e);m.emissiveIntensity=o.ei??1}
  if(o.t){m.transparent=true;m.opacity=o.t}
  matCache.set(k,m);return m;
}
function GEO(k,mk){if(!geoCache.has(k))geoCache.set(k,mk());return geoCache.get(k)}

const RIVER_CENTER=(cellX(RC0)+cellX(RC1))/2;

(function buildGround(){
  const W=GW*CELL+96,H=GH*CELL+90;
  const geo=new THREE.PlaneGeometry(W,H,110,96);
  const pos=geo.attributes.position,col=[];
  const grass=new THREE.Color(0x8fce8f),grass2=new THREE.Color(0x7cbf82),sand=new THREE.Color(0xd8cf9f),deep=new THREE.Color(0x6f9a6f);
  const R=mulberry32(2024);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i);
    let h=0;
    const rd=Math.abs(x-RIVER_CENTER);
    if(rd<RIVER_HALF+1){
      const f=clamp((RIVER_HALF+1-rd)/2.2,0,1);
      h=-1.15*Math.pow(f,1.4);
    }
    const outside=Math.max(Math.abs(x)-GW*CELL/2-4,Math.abs(y)-GH*CELL/2-4,0);
    if(outside>0)h+=Math.sin(x*.045)*Math.cos(y*.05)*(Math.min(outside,26)*.13)+Math.sin(x*.013+y*.02)*Math.min(outside,30)*.09;
    pos.setZ(i,h);
    const c=grass.clone().lerp(grass2,R()*.9);
    if(h<-.15&&h>-.8)c.lerp(sand,clamp(-h/.8,0,1)*.9);
    else if(h<=-.8)c.copy(deep);
    if(outside>6)c.lerp(grass2,.4);
    col.push(c.r,c.g,c.b);
  }
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  geo.computeVertexNormals();
  const grassTex=(()=>{
    const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d'),R=mulberry32(8123);
    g.fillStyle='#f4f7ef';g.fillRect(0,0,256,256);

      g.lineWidth=dk>.66?1.4:1;
      g.beginPath();g.moveTo(x,y);g.lineTo(x+(R()-.5)*3,y-h);g.stroke();
    }
    const t=new THREE.CanvasTexture(c);
    t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;
    t.repeat.set(Math.round(W/8),Math.round(H/8));
    t.anisotropy=renderer.capabilities.getMaxAnisotropy();
    return t;
  })();
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:grassTex,vertexColors:true,roughness:.95}));
  m.rotation.x=-Math.PI/2;m.receiveShadow=true;mapGroup.add(m);

function findPath(a,b){
  if(!roadCells.has(a)||!roadCells.has(b))return null;

  while(q.length){
    const c=q.shift();if(c===b)break;
    const[x,z]=c.split(',').map(Number);
    for(const[dx,dz]of DIRS){
      const nk=key(x+dx,z+dz);
      if(roadCells.has(nk)&&!prev.has(nk)){prev.set(nk,c);q.push(nk)}
    }
  }
  if(!prev.has(b))return null;
  const path=[];let c=b;while(c){path.unshift(c);c=prev.get(c)}
  return path;
}

function prepareAvatar(gltf,sourceAnimations){
  const model=gltf.scene;
  model.updateMatrixWorld(true);
  const bounds=new THREE.Box3().setFromObject(model);
  const height=Math.max(.001,bounds.max.y-bounds.min.y);
  const scale=1.12/height;
  model.scale.setScalar(scale);
  model.position.y=-bounds.min.y*scale;
  model.traverse(obj=>{
    if(obj.isMesh){obj.castShadow=true;obj.receiveShadow=true}
  });
  const bones=new Map();
  model.traverse(obj=>{if(obj.isBone)bones.set(obj.name,obj)});
  const clips={};
  for(const [name,source] of Object.entries(sourceAnimations)){
    if(!source)continue;
    const clip=source.clip.clone();
    clip.name=name;
    clip.tracks=clip.tracks.filter(track=>{
      const separator=track.name.lastIndexOf('.');
      const boneName=track.name.slice(0,separator);
      const targetBone=bones.get(boneName),sourceRest=source.rest.get(boneName);
      if(!targetBone||!sourceRest)return false;
      if(track.name.endsWith('.position'))return boneName!=='mixamorigHips';
      if(!track.name.endsWith('.quaternion'))return false;
      const sourceRestInverse=sourceRest.clone().invert(),targetRest=targetBone.quaternion.clone();
      for(let i=0;i<track.values.length;i+=4){
        const rotation=new THREE.Quaternion(track.values[i],track.values[i+1],track.values[i+2],track.values[i+3]);
        rotation.premultiply(sourceRestInverse).premultiply(targetRest);
        track.values[i]=rotation.x;track.values[i+1]=rotation.y;
        track.values[i+2]=rotation.z;track.values[i+3]=rotation.w;
      }
      return true;
    });
    if(clip.tracks.length)clips[name]=clip;
  }
  return{model,clips};
}
function makePerson(kind){
  const mesh=new THREE.Group();
  const template=avatarTemplates[kind];
  if(!template)return makeFallbackPerson();
  const avatar=cloneSkinned(template.model);
  mesh.add(avatar);
  const mixer=new THREE.AnimationMixer(avatar),actions={};
  for(const [name,clip] of Object.entries(template.clips)){
    const action=mixer.clipAction(clip);
    const oneShot=name.startsWith('turn')||name==='jump';
    action.setLoop(oneShot?THREE.LoopOnce:THREE.LoopRepeat,oneShot?1:Infinity);
    action.clampWhenFinished=oneShot;
    actions[name]=action;
  }
  actions.idle?.play();
  mesh.userData={speed:1.1+Math.random()*.7,animation:{mixer,actions,currentName:'idle'},kind};
  return mesh;
}

function clearCellTree(cx,cz){
  const t=decoTrees.get(key(cx,cz));
  if(t){secRemove(t);decoTrees.delete(key(cx,cz))}
}
const pops=[];
function popIn(g){
  const base=g.scale.x||1;
  g.scale.setScalar(.02*base);
  pops.push({g,base,t:0});
}
function updatePops(dt){
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i];p.t+=dt*3;
    const f=Math.min(1,p.t);
    const c1=1.70158,c3=c1+1;
    const e=1+c3*Math.pow(f-1,3)+c1*Math.pow(f-1,2);
    p.g.scale.setScalar(Math.max(.02,p.base*e));
    if(f>=1){p.g.scale.setScalar(p.base);pops.splice(i,1)}
  }
}
function addBuilding(type,cx,cz,rot=0,lvl=1,id=null,opts={}){
  const d=B[type];
  id=id||('b'+(state.seq++));
  const b={id,type,cx,cz,rot:rot%4,lvl,age:0,spent:opts.spent??d.cost};
  state.buildings.push(b);
  if(d.road){setRoad(cx,cz,d.road)}
  else{
    const g=buildModel(d,hashStr(id),lvl);
    const[rw,rh]=rotSize(d.size[0],d.size[1],b.rot);
    meshTo(g,cx,cz,d.size[0],d.size[1],b.rot);
    g.userData.bid=id;
    secAdd(g,cellX(cx)+(rw-1)*CELL/2,cellZ(cz)+(rh-1)*CELL/2);
    bMeshes.set(id,g);
    if(!opts.silent)popIn(g);
  }
  const[rw,rh]=rotSize(d.size[0],d.size[1],b.rot);
  for(let dx=0;dx<rw;dx++)for(let dz=0;dz<rh;dz++)clearCellTree(cx+dx,cz+dz);
  if(!d.onRoad)markCells(cx,cz,d.size[0],d.size[1],b.rot,id);
  if(d.cat==='res'||d.cat==='com'){
    let lot=(opts.lotId&&state.lots.find(item=>item.id===opts.lotId))||
      state.lots.find(item=>item.status==='available'&&cx>=item.cx&&cz>=item.cz&&cx+rw<=item.cx+item.w&&cz+rh<=item.cz+item.h);
    if(lot&&lot.status==='available')releaseLotCells(lot);
    if(!lot){
      lot={id:'property-'+id,name:d.name,category:d.cat,buildingType:type,cx,cz,w:Math.max(2,rw),h:Math.max(2,rh),
        area:Math.max(16,rw*rh*CELL*CELL),price:d.cost,status:'built',buildingId:id};
      state.lots.push(lot);
    }else Object.assign(lot,{name:d.name,category:d.cat,buildingType:type,status:'built',owned:true,buildingId:id});
    refreshLotMesh(lot);
  }
  if((type==='house'||type==='townhouse')&&Math.random()<.4){
    for(const[dx,dz]of DIRS){const nx=cx+dx*rw,nz=cz+dz*rh;
      if(inMap(nx,nz)&&!occHas(nx,nz)&&!isWater(nx,nz)&&Math.random()<.12){addDecoTree(nx,nz,.7);break}}
  }
  if(!opts.silent)state.stats.built++;
  return b;
}
function removeBuilding(b){
  const d=B[b.type];
  if(!d.onRoad)unmarkCells(b.cx,b.cz,d.size[0],d.size[1],b.rot);
  if(d.road)unsetRoad(b.cx,b.cz);
  const m=bMeshes.get(b.id);
  if(m){secRemove(m);bMeshes.delete(b.id)}
  state.buildings=state.buildings.filter(x=>x.id!==b.id);
  const lot=state.lots.find(item=>item.buildingId===b.id);
  if(lot){
    lot.status='available';lot.buildingId=null;lot.buildingType=b.type;lot.category=d.cat;lot.name=d.name;
    reserveLotCells(lot);refreshLotMesh(lot);
  }
}
function rebuildBuilding(b){
  const d=B[b.type];
  const old=bMeshes.get(b.id);if(old)secRemove(old);
  const g=buildModel(d,hashStr(b.id),b.lvl);
  meshTo(g,b.cx,b.cz,d.size[0],d.size[1],b.rot);
  g.userData.bid=b.id;
  const[rw,rh]=rotSize(d.size[0],d.size[1],b.rot);
  secAdd(g,cellX(b.cx)+(rw-1)*CELL/2,cellZ(b.cz)+(rh-1)*CELL/2);
  bMeshes.set(b.id,g);
  popIn(g);
}

/* ============================================================
   10. ZONAMENTO → crescimento automático
============================================================ */
const GROWTH={
  1:['house','townhouse','sobrado','house_b'],
  2:['shop','bakery','cafe','restaurant','market'],
  3:['post','library','daycare','clinic','busstop'],
  4:['park','plaza','picnic','playground','tree_s','flowers','meadow'],
  5:['workshop']};
let grownToday=0;
function tryGrowth(){
  if(grownToday>=4)return;
  for(let att=0;att<26;att++){
    const cx=Math.floor(Math.random()*GW),cz=Math.floor(Math.random()*GH);
    const z=state.zones[idx(cx,cz)];
    if(!z||!GROWTH[z])continue;
    if(occHas(cx,cz)||isWater(cx,cz))continue;
    if(z===1&&C.demandR<=.05)continue;
    if(z===2&&C.demandC<=.05)continue;
    if(z===3&&C.demandS<=.05)continue;
    if(z===4&&C.demandF<=.05)continue;
    let road=false;for(const[dx,dz]of DIRS)if(isRoad(cx+dx,cz+dz))road=true;
    if(!road)continue;
    const list=GROWTH[z];
    const type=list[Math.floor(Math.random()*list.length)];
    if(B[type].unlock>state.level)continue;
    const rot=Math.floor(Math.random()*4);
    const[rw,rh]=rotSize(B[type].size[0],B[type].size[1],rot);
    if(!freeCells(cx,cz,rw,rh,rot))continue;
    addBuilding(type,cx,cz,rot,1,null,{free:true});
    grownToday++;
    if(grownToday===1)notify('home','A cidade cresce','Uma nova construção surgiu em uma zona '+(ZONE_NAME[z]||'')+'.');
    fx.dust(cellX(cx),cellZ(cz));
    recomputeCity();
    return;
  }
}

let mode='IDLE';

function cloneGhostMats(g){g.traverse(o=>{
  if(o.isMesh||o.isSprite){o.material=o.material.clone();o.userData._cl=true;
    if(o.isMesh){o.material.transparent=true;o.material.opacity=.6}}})}
function disposeGhost(g){if(!g)return;g.traverse(o=>{if(o.userData._cl&&o.material&&o.material.dispose)o.material.dispose()})}
function tintGhost(g,ok){g.traverse(o=>{
  if(o.userData._cl&&o.material&&o.material.color){
    o.material.color.set(ok?0x9ff3c1:0xff8d8d);
    if(o.material.emissive){o.material.emissive.set(ok?0x2f7d58:0x7d2f2f);o.material.emissiveIntensity=.5}
  }})}
function validAt(cx,cz,rot,ignore){
  const d=B[place.type];
  if(d.ov)return inMap(cx,cz)&&!isWater(cx,cz);
  const targetLot=place.lotId&&state.lots.find(lot=>lot.id===place.lotId);
  if(place.lotId){
    if(!targetLot||targetLot.status!=='available'||d.road||d.cat!==targetLot.category)return false;
    const[rw,rh]=rotSize(d.size[0],d.size[1],rot);
    if(cx<targetLot.cx||cz<targetLot.cz||cx+rw>targetLot.cx+targetLot.w||cz+rh>targetLot.cz+targetLot.h)return false;
  }
  if(d.onRoad)return roadCells.has(key(cx,cz));
  if(d.road){
    if(!inMap(cx,cz))return false;
    const k=key(cx,cz);
    return !(occ.has(k)&&occ.get(k)!==ignore);
  }
  return freeCells(cx,cz,d.size[0],d.size[1],rot,ignore||place.lotId);
}
function updateGhost(){
  if(!place.ghost)return;
  const d=B[place.type];
  meshTo(place.ghost,place.cx,place.cz,d.size[0],d.size[1],place.rot);
  place.valid=validAt(place.cx,place.cz,place.rot,place.editId||place.lotId);
  const afford=mode==='EDIT'||state.money>=d.cost;

function createLotFromRect(a,b){
  const x0=Math.min(a.cx,b.cx),z0=Math.min(a.cz,b.cz);
  const w=Math.abs(a.cx-b.cx)+1,h=Math.abs(a.cz-b.cz)+1;
  const category=place.lotCategory||'res';
  const minW=category==='com'?8:6,minH=category==='com'?7:6;
  if(w<minW||h<minH||w*h>100||!inMap(x0,z0)||!inMap(x0+w-1,z0+h-1)){
    notify('warn','Medida inválida','Mínimo: '+minW+' × '+minH+' células ('+(minW*CELL)+' × '+(minH*CELL)+' m).','err');return null;
  }
  for(let x=x0;x<x0+w;x++)for(let z=z0;z<z0+h;z++)if(isWater(x,z)||occ.has(key(x,z))){
    notify('warn','Área ocupada','Desenhe o lote sobre terreno livre, sem ruas ou construções.','err');return null;
  }
  const price=Math.round(w*h*(category==='com'?28:18));
  if(state.money<price){notify('coin','Sem fundos','Comprar este lote custa '+fmt$(price)+'.','err');return null}
  const type=category==='com'?'shop':'house';
  const lot={id:'lot-'+(state.seq++),name:category==='com'?'Lote Comercial':'Lote Residencial',category,
    buildingType:type,cx:x0,cz:z0,w,h,area:w*h*CELL*CELL,price,status:'available',owned:true,buildingId:null};
  pushUndo();state.money-=price;state.stats.spent+=price;state.lots.push(lot);reserveLotCells(lot);refreshLotMesh(lot);
  AudioSys.place(540);updateHUD();save();return lot;
}

function confirmPlace(){
  if(mode==='ZONE')return;
  const d=B[place.type];
  place.valid=validAt(place.cx,place.cz,place.rot,place.editId||place.lotId);
  if(!place.valid){AudioSys.err();fx.error(place.ghost);return}
  if(mode==='BUILD'){
    if(state.money<d.cost){AudioSys.err();notify('coin','Sem fundos','O tesouro não cobre esta construção.','err');return}
    if(d.ov){
      pushUndo();
      state.money-=d.cost;state.stats.spent+=d.cost;
      addOverlay(place.type,place.cx,place.cz);
      AudioSys.place(PITCH[B[place.type]?B[place.type].cat:'res']||520);fx.dust(place.ghost.position.x,place.ghost.position.z);
      updateHUD();recomputeCity();checkTutorial();save();
      if(state.money<d.cost){cancelMode();buildPanelToggle(false)}
      return;
    }
    if(!(d.road&&strokeUndo))pushUndo();
    if(d.road)strokeUndo=true;
    state.money-=d.cost;state.stats.spent+=d.cost;
    const lotId=place.lotId;
    addBuilding(place.type,place.cx,place.cz,place.rot,1,null,{lotId});
    AudioSys.place(PITCH[B[place.type]?B[place.type].cat:'res']||520);fx.dust(place.ghost.position.x,place.ghost.position.z);
    updateHUD();recomputeCity();checkTutorial();
    if(lotId){save();cancelMode();buildPanelToggle(false);return}
    if(state.money<d.cost){cancelMode();buildPanelToggle(false)}
  }else if(mode==='EDIT'){
    pushUndo();
    const b=state.buildings.find(x=>x.id===place.editId);
    if(b){
      b.cx=place.cx;b.cz=place.cz;b.rot=place.rot;
      const m=bMeshes.get(b.id);
      if(m){meshTo(m,b.cx,b.cz,d.size[0],d.size[1],b.rot);m.visible=true;fx.dust(m.position.x,m.position.z)}
      markCells(b.cx,b.cz,d.size[0],d.size[1],b.rot,b.id);
    }
    AudioSys.place(PITCH[B[place.type]?B[place.type].cat:'res']||520);updateHUD();recomputeCity();
    cancelMode();
  }
  save();
}

function rotateSelected(b){

  const[rw,rh]=rotSize(d.size[0],d.size[1],nr);
  unmarkCells(b.cx,b.cz,d.size[0],d.size[1],b.rot);
  let ok=true;
  for(let dx=0;dx<rw;dx++)for(let dz=0;dz<rh;dz++){
    if(!inMap(b.cx+dx,b.cz+dz)||occHas(b.cx+dx,b.cz+dz)||isWater(b.cx+dx,b.cz+dz))ok=false;
  }
  if(!ok){markCells(b.cx,b.cz,d.size[0],d.size[1],b.rot);

  pushUndo();

function upgradeB(b){

addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==window.parent)return;
  const message=event.data;
  if(message?.source!=='cityhost'||message?.type!=='lot-updated'||typeof message.lot?.id!=='string')return;
  const lot=state.lots.find(item=>item.id===message.lot.id);
  if(!lot)return;
  if(message.lot.hasStructure){
    const requested=message.lot.buildingType;
    const type=B[requested]&&B[requested].cat===lot.category?requested:(lot.category==='com'?'shop':'house');
    lot.name=typeof message.lot.name==='string'?message.lot.name:lot.name;
    lot.buildingType=type;lot.owned=true;
    if(lot.status==='available')addBuilding(type,lot.cx,lot.cz,0,1,null,{lotId:lot.id,free:true,silent:true});
  }else if(lot.status==='built'&&lot.buildingId){
    const building=state.buildings.find(item=>item.id===lot.buildingId);
    if(building)removeBuilding(building);
  }
  refreshLotMesh(lot);recomputeCity();updateHUD();save();
});

  }else{

  }

  el.style.opacity=1;
}

const undoStack=[],redoStack=[];
const MAXUNDO=30;
function snapshot(){
  return{
    money:state.money,seq:state.seq,
    buildings:state.buildings.map(b=>({id:b.id,type:b.type,cx:b.cx,cz:b.cz,rot:b.rot,lvl:b.lvl,age:b.age,spent:b.spent})),
    lots:state.lots.map(lot=>({...lot})),
    overlays:state.overlays.map(o=>({id:o.id,type:o.type,cx:o.cx,cz:o.cz})),
    zones:Array.from(state.zones)
  };
}
function pushUndo(){
  undoStack.push(snapshot());
  if(undoStack.length>MAXUNDO)undoStack.shift();
  redoStack.length=0;
  updateUndoUI();
}
function applySnapshot(s){
  for(const b of [...state.buildings])removeBuilding(b);
  for(const o of [...state.overlays])removeOverlay(o);
  for(const k of roadNodes()){const[x,z]=k.split(',').map(Number);unsetRoad(x,z)}
  for(const k of [...zMeshes.keys()]){const m=zMeshes.get(k);if(m)zoneGroup.remove(m);zMeshes.delete(k)}
  pops.length=0;
  state.money=s.money;
  state.seq=Math.max(1,s.seq);
  state.zones=Uint8Array.from(s.zones);
  state.lots=Array.isArray(s.lots)?s.lots.map(lot=>({...lot})):[];
  state.buildings=s.buildings.map(b=>({...b}));
  state.overlays=s.overlays.map(o=>({...o}));
  hydrateAll();
  ensureCityLots();
  recomputeCity();syncCitizens();updateHUD();
  save();
}
function doUndo(){
  if(mode!=='IDLE'||!undoStack.length){AudioSys.err();return}
  exitCtx();
  redoStack.push(snapshot());
  applySnapshot(undoStack.pop());
  AudioSys.click();
  notify('undo','Desfeito','A última ação voltou ao estado anterior.');
  updateUndoUI();
}
function doRedo(){
  if(mode!=='IDLE'||!redoStack.length){AudioSys.err();return}
  exitCtx();
  undoStack.push(snapshot());
  applySnapshot(redoStack.pop());
  AudioSys.click();
  notify('redo','Refeito','A ação voltou a ser aplicada.');
  updateUndoUI();
}
function updateUndoUI(){
  $('btnUndo').classList.toggle('off',!undoStack.length);
  $('btnRedo').classList.toggle('off',!redoStack.length);
}

   12. CIDADÃOS COM ROTINA (+ passeios)
============================================================ */
const NPCS_ENABLED=false;
const MAXNPC=isMobile?32:64;
const citizens=[];
let homesCache=[],workCache=[],parkCache=[],eduCache=[],comCache=[];
loadCitizenModels();
function rebuildCaches(){
  homesCache=[];workCache=[];parkCache=[];eduCache=[];comCache=[];
  for(const b of state.buildings){
    const d=B[b.type];
    if(d.cat==='res'&&d.cap)homesCache.push(b);
    if(d.jobs)workCache.push(b);
    if(d.model==='park'||d.id==='plaza'||d.id==='kidpark'||d.id==='playground')parkCache.push(b);
    if(d.cov&&d.cov.t==='edu')eduCache.push(b);
    if(d.cat==='com')comCache.push(b);
  }
}
function bRoad(b){
  if(b._rcv===roadVersion)return b._rc;
  const d=B[b.type];const[rw,rh]=rotSize(d.size[0],d.size[1],b.rot);
  b._rc=nearestRoad(b.cx+Math.floor(rw/2),b.cz+Math.floor(rh/2));
  b._rcv=roadVersion;
  return b._rc;
}
function newCitizen(){
  if(!NPCS_ENABLED||!citizenModelsReady||!homesCache.length)return null;
  const home=homesCache[Math.floor(Math.random()*homesCache.length)];
  const r=Math.random();
  const role=r<.5?'worker':r<.75?'student':'senior';
  const pick=arr=>arr.length?arr[Math.floor(Math.random()*arr.length)]:null;
  const c={role,kind:Math.random()<.5?'female':'male',home,work:pick(workCache),school:pick(eduCache),park:pick(parkCache),market:pick(comCache),
    mesh:null,state:'hidden',path:null,pi:0,tgtB:null,placeMode:'home',wanderT:0,wx:0,wz:0,bx:0,bz:0,
    curCell:null,side:1,strollT:0,turnClip:null,turnCooldown:0,motionClip:null,motionClipTime:0};
  c.mesh=makePerson(c.kind);
  c.mesh.visible=false;
  peopleGroup.add(c.mesh);
  return c;
}
function syncCitizens(){
  if(!NPCS_ENABLED){
    for(const c of citizens)peopleGroup.remove(c.mesh);
    citizens.length=0;
    return;
  }
  rebuildCaches();
  const want=clamp(Math.round(10+state.pop*.1),10,MAXNPC);
  while(citizens.length<want){const c=newCitizen();if(!c)break;citizens.push(c)}
  while(citizens.length>want){const c=citizens.pop();peopleGroup.remove(c.mesh)}
  for(const c of citizens){
    if(!state.buildings.includes(c.home))c.home=homesCache[Math.floor(Math.random()*homesCache.length)]||null;
    if(!state.buildings.includes(c.work))c.work=workCache[Math.floor(Math.random()*workCache.length)]||null;
    if(!state.buildings.includes(c.park))c.park=parkCache[Math.floor(Math.random()*parkCache.length)]||null;
    if(!state.buildings.includes(c.market))c.market=comCache[Math.floor(Math.random()*comCache.length)]||null;
  }
}
function desiredPlace(c){
  const h=state.t;
  const bad=(state.weather==='rain'||state.weather==='storm');
  let p;
  if(c.role==='worker'){
    if(h>=7&&h<12)p='work';
    else if(h>=12&&h<13)p=Math.random()<.35?'market':'work';
    else if(h>=13&&h<17)p='work';
    else if(h>=17&&h<19)p=(!bad&&c.park&&Math.random()<.55)?'park':'home';
    else p='home';
  }else if(c.role==='student'){
    if(h>=8&&h<13)p='school';
    else if(h>=13&&h<14)p='home';
    else if(h>=14&&h<16)p='school';
    else if(h>=16&&h<18)p=(!bad&&c.park)?'park':'home';
    else p='home';
  }else{
    if(h>=9&&h<12)p=(!bad&&c.park)?'park':'home';
    else if(h>=12&&h<15)p='home';
    else if(h>=15&&h<18)p=(!bad&&c.park)?'park':'home';
    else p='home';
  }
  /* passeio espontâneo durante o dia */
  if(!bad&&h>=10&&h<17&&c.curCell&&Math.random()<.12)p='stroll';
  if(bad&&p!=='home'&&p!=='work'&&p!=='school')p='home';
  return p;
}
function bForMode(c,m){
  if(m==='home')return c.home;if(m==='work')return c.work;
  if(m==='school')return c.school;if(m==='park')return c.park;if(m==='market')return c.market;
  return null;
}
function arrive(c,b){
  c.state=(c.placeMode==='home'||c.placeMode==='work'||c.placeMode==='school')?'hidden':'leisure';
  c.mesh.visible=(c.state==='leisure');
  c.tgtB=b;c.wanderT=0;
  c.curCell=bRoad(b);
  if(c.mesh.visible&&b){const d=B[b.type];const[x,z]=CENTER(b.cx,b.cz,d.size[0],d.size[1],b.rot);
    c.mesh.position.set(x,0,z);c.bx=x;c.bz=z;c.wx=x;c.wz=z}
}
function arriveStroll(c){
  c.state='leisure';c.tgtB=null;
  c.mesh.visible=true;
  c.strollT=6+Math.random()*8;
  c.bx=c.mesh.position.x;c.bz=c.mesh.position.z;
  c.wx=c.bx;c.wz=c.bz;
}
function sendTo(c,m){
  if(m==='stroll'){
    c.placeMode='stroll';
    const nodes=roadNodes();
    if(!nodes.length||!c.curCell){c.state='hidden';c.mesh.visible=false;return}
    let best=null;
    for(let i=0;i<8;i++){
      const n=nodes[Math.floor(Math.random()*nodes.length)];
      const[nx,nz]=n.split(',').map(Number);
      const[cx2,cz2]=c.curCell.split(',').map(Number);
      const d=Math.abs(nx-cx2)+Math.abs(nz-cz2);
      if(d>0&&d<=10){best=n;break}
    }
    if(!best){c.state='hidden';c.mesh.visible=false;return}
    const path=findPath(c.curCell,best);
    if(!path||path.length<2){c.state='hidden';c.mesh.visible=false;return}
    c.path=path;c.pi=0;c.state='travel';c.tgtB=null;c.mesh.visible=true;
    c.side=Math.random()<.5?1:-1;
    const[x,z]=path[0].split(',').map(Number);
    c.mesh.position.set(cellX(x),0,cellZ(z));
    return;
  }
  const b=bForMode(c,m);
  c.placeMode=m;
  if(!b){c.state='hidden';c.mesh.visible=false;return}
  const rc=bRoad(b);
  if(!rc){c.state='hidden';c.mesh.visible=false;return}
  const from=c.curCell||bRoad(c.home)||rc;
  if(from===rc){arrive(c,b);return}
  const path=findPath(from,rc);
  if(!path||path.length<2){c.state='hidden';c.mesh.visible=false;return}
  c.path=path;c.pi=0;c.state='travel';c.tgtB=b;c.mesh.visible=true;
  c.side=Math.random()<.5?1:-1;
  const[x,z]=path[0].split(',').map(Number);
  c.mesh.position.set(cellX(x),0,cellZ(z));
}
let citTick=0;
function animateCitizen(c,dt){
  const animation=c.mesh.userData.animation;
  if(!animation)return;
  const moving=c.state==='travel'||(c.state==='leisure'&&Math.hypot(c.wx-c.mesh.position.x,c.wz-c.mesh.position.z)>.1);
  c.turnCooldown=Math.max(0,c.turnCooldown-dt);
  c.motionClipTime=Math.max(0,c.motionClipTime-dt);
  const defaultClip=moving?'walk':'idle';
  const desired=c.turnClip||((moving&&c.motionClipTime>0&&c.motionClip)?c.motionClip:defaultClip);
  const next=animation.actions[desired]||animation.actions[defaultClip]||animation.actions.idle;
  if(next&&animation.currentAction!==next){
    animation.currentAction?.fadeOut(.2);
    next.reset().fadeIn(.2).play();
    animation.currentAction=next;
    animation.currentName=desired;
  }
  animation.mixer.update(dt);
  if(c.turnClip&&animation.currentName===c.turnClip&&!animation.actions[c.turnClip]?.isRunning())c.turnClip=null;
}
function updateCitizens(dt){
  if(!NPCS_ENABLED)return;
  citTick+=dt;
  const doDecide=citTick>.6;if(doDecide)citTick=0;
  const rush=(state.weather==='rain'||state.weather==='storm')?1.4:1;
  let idx2=0;
  for(const c of citizens){
    idx2++;
    animateCitizen(c,dt);
    if(doDecide&&((idx2+Math.floor(state.t*7))%3===0)){
      const want=desiredPlace(c);
      if(want!==c.placeMode&&c.state!=='travel')sendTo(c,want);
    }
    if(c.state==='travel'&&c.path){
      const next=c.path[c.pi+1];
      if(!next||!roadCells.has(next)){c.state='hidden';c.mesh.visible=false;c.path=null;continue}
      const[ax,az]=c.path[c.pi].split(',').map(Number);
      const[bxq,bzq]=next.split(',').map(Number);
      const dx=bxq-ax,dz=bzq-az,len=Math.hypot(dx,dz)||1;
      const px=(dz/len)*.8*c.side,pz=(-dx/len)*.8*c.side;
      const tx=cellX(bxq)+px,tz=cellZ(bzq)+pz;
      const m=c.mesh,sp=c.mesh.userData.speed*rush;
      const ddx=tx-m.position.x,ddz=tz-m.position.z,dd=Math.hypot(ddx,ddz);
      if(dd<.12){
        c.pi++;c.curCell=next;
        if(c.pi>=c.path.length-1){
          c.path=null;
          if(c.placeMode==='stroll')arriveStroll(c);
          else arrive(c,c.tgtB);
        }
      }else{
        const st=Math.min(sp*dt,dd);
        m.position.x+=ddx/dd*st;m.position.z+=ddz/dd*st;
        const heading=Math.atan2(-ddz,ddx);
        const yaw=Math.atan2(Math.sin(heading-m.rotation.y),Math.cos(heading-m.rotation.y));
        if(Math.abs(yaw)>.75&&c.turnCooldown<=0){
          const direction=yaw>0?'Right':'Left';
          const variant=Math.random()<.5?'Alt':'';
          const key='turn'+direction+variant;
          if(c.mesh.userData.animation?.actions[key])c.turnClip=key;
          c.turnCooldown=.9;
        }else if(Math.abs(yaw)>.28&&!c.turnClip){
          c.motionClip=yaw>0?'strafeWalkRight':'strafeWalkLeft';
          c.motionClipTime=.42;
        }
        m.rotation.y=heading;
        m.position.y=isWater(bxq,bzq)?.13:0;
      }
    }else if(c.state==='leisure'){
      if(c.placeMode==='stroll'){
        c.strollT-=dt;
        if(c.strollT<=0){sendTo(c,'home');continue}
        if(Math.hypot(c.wx-c.mesh.position.x,c.wz-c.mesh.position.z)<.15&&Math.random()<.02){
          c.wx=c.bx+(Math.random()-.5)*3;c.wz=c.bz+(Math.random()-.5)*3;
        }
      }else if(c.tgtB){
        c.wanderT-=dt;
        if(c.wanderT<=0){
          c.wanderT=1.5+Math.random()*2.5;
          const d=B[c.tgtB.type];const[x,z]=CENTER(c.tgtB.cx,c.tgtB.cz,d.size[0],d.size[1],c.tgtB.rot);
          c.wx=x+(Math.random()-.5)*d.size[0]*1.5;c.wz=z+(Math.random()-.5)*d.size[1]*1.5;
        }
      }
      const m=c.mesh,ddx=c.wx-m.position.x,ddz=c.wz-m.position.z,dd=Math.hypot(ddx,ddz);
      if(dd>.1){
        const st=c.mesh.userData.speed*.7*dt;
        m.position.x+=ddx/dd*st;m.position.z+=ddz/dd*st;
        const heading=Math.atan2(-ddz,ddx);
        const yaw=Math.atan2(Math.sin(heading-m.rotation.y),Math.cos(heading-m.rotation.y));
        if(Math.abs(yaw)>.75&&c.turnCooldown<=0){
          const direction=yaw>0?'Right':'Left';
          const variant=Math.random()<.5?'Alt':'';
          const key='turn'+direction+variant;
          if(c.mesh.userData.animation?.actions[key])c.turnClip=key;
          c.turnCooldown=.9;
        }else if(Math.abs(yaw)>.28&&!c.turnClip){
          c.motionClip=yaw>0?'strafeWalkRight':'strafeWalkLeft';
          c.motionClipTime=.42;
        }
        m.rotation.y=heading;
        m.position.y=0;
      }
    }
  }
}

   13. VEÍCULOS
============================================================ */
const MAXCARS=isMobile?10:24;
const cars=[];
function spawnCar(type){
  const nodes=roadNodes();
  if(nodes.length<3)return null;
  const c={mesh:makeVehicle(type),type,path:null,pi:0,
    speed:({car:3.1,bus:2.3,truck:2.6,ambulance:4.4,firetruck:4.2})[type]||3,
    active:false,retimer:0,emergency:false};
  c.mesh.visible=false;carGroup.add(c.mesh);
  retargetCar(c);
  return c;
}
function retargetCar(c,targetCell){
  const nodes=roadNodes();
  if(nodes.length<3){c.active=false;c.mesh.visible=false;c.retimer=2+Math.random()*4;return}
  const from=c.curCell||nodes[Math.floor(Math.random()*nodes.length)];
  const to=targetCell||nodes[Math.floor(Math.random()*nodes.length)];
  const path=findPath(from,to);
  if(!path||path.length<2){c.active=false;c.mesh.visible=false;c.retimer=2+Math.random()*4;return}
  c.path=path;c.pi=0;c.active=true;c.mesh.visible=true;
  c.curCell=path[0];
  const[x,z]=path[0].split(',').map(Number);
  c.mesh.position.set(cellX(x),.1,cellZ(z));
}
function dispatchEmergency(type,targetCell){
  let c=cars.find(k=>!k.active&&k.type===type)||cars.find(k=>!k.active);
  if(!c){c={mesh:makeVehicle(type),type,path:null,pi:0,speed:4.3,active:false,retimer:0,emergency:true};
    carGroup.add(c.mesh);cars.push(c)}
  else if(c.type!==type){carGroup.remove(c.mesh);c.mesh=makeVehicle(type);carGroup.add(c.mesh)}
  c.emergency=true;c.type=type;c.speed=4.3;
  retargetCar(c,targetCell);
  if(c.mesh.userData.bar)c.mesh.userData.bar.visible=true;
}
let carSpawnT=0;
function updateCars(dt){
  const night=dayLight<.18;
  const want=Math.min(MAXCARS,Math.floor(roadCells.size/5)+((C.trafficMod||1)>1?4:0));
  let active=0;for(const c of cars)if(c.active)active++;
  carSpawnT-=dt;
  if(active<want*(night?.45:1)&&roadCells.size>=6&&carSpawnT<=0&&cars.length<MAXCARS+4){
    const r=Math.random();
    const c=spawnCar(r<.7?'car':r<.82?'bus':r<.94?'truck':'car');
    if(c)cars.push(c);
    carSpawnT=1.2;
  }
  if(cars.length>MAXCARS+6){const i=cars.findIndex(k=>!k.active);if(i>=0){carGroup.remove(cars[i].mesh);cars.splice(i,1)}}
  const spdMul=C.carSpeedMul||1;
  for(const c of cars){
    if(!c.active){
      c.retimer-=dt;
      if(c.emergency){if(c.mesh.userData.bar)c.mesh.userData.bar.visible=false;c.emergency=false}
      if(c.retimer<=0)retargetCar(c);
      continue;
    }
    const next=c.path?c.path[c.pi+1]:null;
    if(!next||!roadCells.has(next)){
      if(c.emergency){c.active=false;c.mesh.visible=false;c.retimer=6}
      else retargetCar(c);
      continue;
    }
    const[ax,az]=c.path[c.pi].split(',').map(Number);
    const[bxq,bzq]=next.split(',').map(Number);
    const dx=bxq-ax,dz=bzq-az,len=Math.hypot(dx,dz)||1;
    const px=(dz/len)*.45,pz=(-dx/len)*.45;
    const tx=cellX(bxq)+px,tz=cellZ(bzq)+pz;
    const m=c.mesh;
    const ddx=tx-m.position.x,ddz=tz-m.position.z,dd=Math.hypot(ddx,ddz);
    const sp=c.speed*spdMul*(isWater(bxq,bzq)?.8:1);
    if(dd<.2){
      c.pi++;c.curCell=next;
      const i=idx(bxq,bzq);if(i>=0)trafficGrid[i]+=dt*2;
      if(c.pi>=c.path.length-1){
        if(c.emergency){
          c.active=false;c.mesh.visible=false;c.retimer=6;
          if(c.mesh.userData.bar)c.mesh.userData.bar.visible=false;
        }else if(Math.random()<.3){c.active=false;c.mesh.visible=false;c.retimer=2+Math.random()*5}
        else retargetCar(c);
      }
    }else{
      const st=Math.min(sp*dt,dd);
      m.position.x+=ddx/dd*st;m.position.z+=ddz/dd*st;
      m.position.y=isWater(bxq,bzq)?.13:.1;
      m.rotation.y=Math.atan2(-ddz,ddx);
    }
    if(c.mesh.userData.bar)c.mesh.userData.bar.material.opacity=(Math.sin(performance.now()*.02)>0)?.85:.1;
  }
}

============================================================ */
const SKY_STOPS=[[0,0x0e1a2a],[4.5,0x14243a],[6.2,0xf0b586],[8,0xaadeef],[12,0xbfe6f5],[17,0xa8d4e6],[19,0xef9d6b],[20.5,0x2c3a52],[22,0x11202f],[24,0x0e1a2a]];
const _ca=new THREE.Color(),_cb=new THREE.Color(),skyCol=new THREE.Color();
function skyAt(t){
  for(let i=0;i<SKY_STOPS.length-1;i++){
    if(t>=SKY_STOPS[i][0]&&t<=SKY_STOPS[i+1][0]){
      const f=(t-SKY_STOPS[i][0])/(SKY_STOPS[i+1][0]-SKY_STOPS[i][0]||1);
      _ca.setHex(SKY_STOPS[i][1]);_cb.setHex(SKY_STOPS[i+1][1]);
      return skyCol.lerpColors(_ca,_cb,f);
    }
  }
  return skyCol.setHex(0xbfe6f5);
}
const WEATHER_DEF={
  sun:{sun:1,fogF:1,cloud:.15,rain:false,happy:1,name:'Ensolarado',icon:'sun'},
  cloud:{sun:.55,fogF:.85,cloud:.7,rain:false,happy:0,name:'Nublado',icon:'cloud'},
  rain:{sun:.32,fogF:.55,cloud:.95,rain:true,happy:-2,name:'Chuva',icon:'rain'},
  storm:{sun:.2,fogF:.4,cloud:1,rain:true,happy:-4,name:'Tempestade',icon:'storm'},
  fog:{sun:.5,fogF:.28,cloud:.35,rain:false,happy:-1,name:'Neblina',icon:'fog'}};
let weatherT=4,curW={sun:1,fog:1,cloud:.15};
let dayLight=1,nightF=0,lampOut=false,lightningT=0,growAcc=0,econAcc=0;
function setWeather(w,dur){state.weather=w;weatherT=dur;
  notify(WEATHER_DEF[w].icon,WEATHER_DEF[w].name,'O clima mudou na cidade.')}
function pickWeather(){
  const r=Math.random();
  setWeather(r<.5?'sun':r<.72?'cloud':r<.86?'rain':r<.9?'storm':'fog',2+Math.random()*3);
}
function settingsDist(){return state.settings.dist==='low'?.55:state.settings.dist==='medium'?.8:1}
function updateWeatherTime(dt){
  weatherT-=dt/HOUR;
  if(weatherT<=0)pickWeather();
  const W=WEATHER_DEF[state.weather];
  curW.sun=lerp(curW.sun,W.sun,dt*.5);
  curW.fog=lerp(curW.fog,W.fogF,dt*.4);
  curW.cloud=lerp(curW.cloud,W.cloud,dt*.5);
  state.t+=dt/HOUR;
  if(state.t>=24){state.t-=24;state.day++;state.stats.days=state.day;dayTick()}
  econAcc+=dt/HOUR;
  while(econAcc>=1){
    econAcc-=1;
    const inc=C.balance/720;
    state.money+=inc;
    if(inc>0)state.stats.earned+=inc;
    updateHUD();
  }
  const t=state.t;
  const elev=Math.sin((t-6)/12*Math.PI);
  dayLight=Math.max(0,elev);
  const ang=(t-6)/12*Math.PI;
  sun.position.set(Math.cos(ang)*45,Math.max(elev,.02)*50+4,20);
  /* discos de sol e lua no firmamento */
  _skyV.set(Math.cos(ang),Math.sin(ang),.42).normalize();
  sunDisc.position.copy(_skyV).multiplyScalar(150);
  moonDisc.position.copy(_skyV).multiplyScalar(-150);
  sunDisc.material.opacity=clamp(dayLight*2.4,0,1)*(1-curW.cloud*.6);
  sunDisc.material.color.setHSL(.085+.05*dayLight,.85,.55+.3*dayLight);
  moonDisc.material.opacity=clamp((1-dayLight)*1.5,0,1)*(1-curW.cloud*.7);
  sun.intensity=(.15+dayLight*1.15)*curW.sun;
  sun.color.setHSL(.1,.5,.5+.5*dayLight);
  moon.intensity=.14*(1-dayLight)*curW.sun;
  hemi.intensity=.3+dayLight*.6*curW.sun;
  nightF=clamp(1-(dayLight-.03)/.22,0,1);
  skyAt(t);
  const gray=new THREE.Color(0x8a949a);
  skyCol.lerp(gray,curW.cloud*.6*(1-Math.abs(dayLight-.5)));
  scene.background=skyCol;
  scene.fog.color.copy(skyCol);
  scene.fog.near=lerp(70,26,1-curW.fog);
  scene.fog.far=lerp(200,70,1-curW.fog)*settingsDist();
  stars.material.opacity=nightF*(1-curW.cloud)*.9;
  stars.visible=nightF>.05&&state.settings.particles;
  const lampOn=nightF*(lampOut?0:1);
  for(const nm of nightMats)nm.m.emissiveIntensity=nm.base*lampOn;
  glowMat.opacity=.55*lampOn;
  headMat.opacity=.7*nightF;
  updateRain(dt,W.rain&&state.settings.particles);
  AudioSys.setRain(W.rain?(state.weather==='storm'?0.5:0.28):0);
  updatePollen(dt,state.settings.particles&&dayLight>.25&&curW.cloud<.75&&state.weather!=='storm'&&!W.rain);
  if(state.weather==='storm'&&state.settings.particles){
    lightningT-=dt;
    if(lightningT<=0){
      lightningT=3+Math.random()*7;
      hemi.intensity=2.2;renderer.toneMappingExposure=1.9;
      setTimeout(()=>{renderer.toneMappingExposure=1.05},110);
    }
  }
  for(const c of clouds){
    c.position.x+=c.userData.v*dt;
    if(c.position.x>75)c.position.x=-75;
  }
  cloudMat.opacity=lerp(.25,.95,curW.cloud);
  cloudMat.color.setHSL(.6,.05,lerp(1,.5,curW.cloud)*(0.35+.65*Math.max(dayLight,.15)));
  for(const b of birds){
    const u=b.userData;u.a+=dt*u.sp*(W.rain?0:1);
    b.position.set(u.cx+Math.cos(u.a)*u.r,u.h+Math.sin(u.a*2)*.6,u.cz+Math.sin(u.a)*u.r);
    b.rotation.y=-u.a-Math.PI/2;
    b.children[1].scale.y=.6+Math.sin(performance.now()*.02)*.4;
    b.visible=!W.rain&&dayLight>.1;
  }
  waterUniforms.uTime.value=performance.now()*.001;
  if(!zoneLock&&zoneFade>0){zoneFade-=dt;if(zoneFade<=0)zoneGroup.visible=(overlayMode==='zones')}
  growAcc+=dt;
  if(growAcc>HOUR*5){growAcc=0;popGrowth()}
}
const rain=(()=>{
  const N=isMobile?420:700,p=new Float32Array(N*3);
  for(let i=0;i<N;i++){p[i*3]=(Math.random()-.5)*70;p[i*3+1]=Math.random()*24;p[i*3+2]=(Math.random()-.5)*70}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({color:0x9db8d8,size:.14,transparent:true,opacity:.65}));
  pts.visible=false;scene.add(pts);return pts})();
function updateRain(dt,on){
  rain.visible=on;
  if(!on)return;
  rain.position.set(controls.target.x,0,controls.target.z);
  const p=rain.geometry.attributes.position;
  for(let i=0;i<p.count;i++){
    let y=p.getY(i)-dt*26;
    if(y<0){y=22;p.setX(i,(Math.random()-.5)*70);p.setZ(i,(Math.random()-.5)*70)}
    p.setY(i,y);
  }
  p.needsUpdate=true;
}

let C={cap:0,jobs:0,inc:0,upk:0,tax:0,rev:0,exp:0,balance:0,counts:{roads:0,bridges:0,res:0,com:0,svc:0,fun:0,nat:0,inf:0},
  unemp:0,cov:{edu:0,health:0,sec:0,power:0},polAvg:0,pol:new Float32Array(GW*GH),trafficSat:0,
  demandR:0,demandC:0,demandS:0,demandF:0,green:0,actCars:0,carSpeedMul:1,trafficMod:1,cityHall:0,comJobs:0,eventHappy:0,incomeEventMul:1};
const activeMods=[];
function absHours(){return state.day*24+state.t}
function applyEventMods(){
  C.eventHappy=0;C.incomeEventMul=1;C.carSpeedMul=1;C.trafficMod=1;
  for(const m of activeMods){
    C.eventHappy+=m.happy||0;
    if(m.incomeMul)C.incomeEventMul*=m.incomeMul;
    if(m.speedMul)C.carSpeedMul*=m.speedMul;
    if(m.traffic)C.trafficMod*=m.traffic;
  }
}
function recomputeCity(){
  const counts={res:0,com:0,svc:0,fun:0,nat:0,inf:0,roads:roadCells.size,bridges:0};
  let cap=0,jobs=0,inc=0,upk=0,happyB=0,polS=0,green=0,comJobs=0;
  let eduP=0,healthP=0,secP=0,powerP=0,cityHall=0;
  for(const b of state.buildings){
    const d=B[b.type];counts[d.cat]++;
    const lm=1+.5*(b.lvl-1);
    cap+=d.cap*lm;jobs+=d.jobs*lm;if(d.cat==='com')comJobs+=d.jobs*lm;
    inc+=d.income*(1+.4*(b.lvl-1));upk+=d.upkeep*(1+.3*(b.lvl-1));
    happyB+=d.happy;polS+=d.pol;green+=d.green;
    if(d.cov){
      if(d.cov.t==='edu')eduP+=d.cov.p;
      if(d.cov.t==='health')healthP+=d.cov.p;
      if(d.cov.t==='sec')secP+=d.cov.p;
      if(d.cov.t==='power')powerP+=d.cov.p;
    }
    if(d.id==='cityhall')cityHall=1;
  }
  /* sobreposições contribuem com verde/felicidade */
  for(const o of state.overlays){const d=B[o.type];green+=d.green;happyB+=d.happy}
  for(const k of roadCells.keys()){const[x,z]=k.split(',').map(Number);if(isWater(x,z))counts.bridges++}
  const shopNeed=Math.max(30,jobs*4);
  const incomeMul=C.incomeEventMul*Math.min(1.15,.35+state.pop/shopNeed);
  const tax=state.pop*state.tax*(.7+state.happy/200)*(cityHall?1.08:1);
  const salaries=jobs*1.4;
  const rev=inc*incomeMul+tax;
  const exp=upk+salaries;
  const balance=Math.round(rev-exp);
  const labor=state.pop*.52;
  const employed=Math.min(jobs,labor);
  const unemp=labor>0?Math.max(0,(labor-employed)/labor):0;
  const cov={
    edu:Math.min(1,eduP/Math.max(1,state.pop*.5)),
    health:Math.min(1,healthP/Math.max(1,state.pop*.4)),
    sec:Math.min(1,secP/Math.max(1,state.pop*.35)),
    power:Math.min(1,powerP/Math.max(1,state.pop*.6))};
  const pol=new Float32Array(GW*GH);
  for(const b of state.buildings){
    const d=B[b.type];if(!d.pol&&!d.road)continue;
    const amt=d.pol||.12;
    const[rw,rh]=rotSize(d.size[0],d.size[1],b.rot);
    for(let dx=0;dx<rw;dx++)for(let dz=0;dz<rh;dz++){
      const i=idx(b.cx+dx,b.cz+dz);if(i>=0)pol[i]+=amt}
  }
  /* verde limpa a poluição apenas na vizinhança de cada fonte (barato) */
  for(const b of state.buildings){
    const d=B[b.type];if(!(d.green>0||d.cat==='fun'))continue;
    const gr=Math.max(d.size)+2;
    for(let z=Math.max(0,b.cz-gr);z<=Math.min(GH-1,b.cz+gr);z++)
      for(let x=Math.max(0,b.cx-gr);x<=Math.min(GW-1,b.cx+gr);x++){
        if(Math.max(Math.abs(x-b.cx),Math.abs(z-b.cz))>gr)continue;
        const i=idx(x,z);if(pol[i]>.25)pol[i]-=.25;else pol[i]=0;
      }
  }
  for(const o of state.overlays){
    const d=B[o.type];if(!(d.green>0))continue;
    const gr=2;
    for(let z=Math.max(0,o.cz-gr);z<=Math.min(GH-1,o.cz+gr);z++)
      for(let x=Math.max(0,o.cx-gr);x<=Math.min(GW-1,o.cx+gr);x++){
        const i=idx(x,z);if(pol[i]>.25)pol[i]-=.25;else pol[i]=0;
      }
  }
  for(let i=0;i<pol.length;i++)if(pol[i]<.02)pol[i]=0;
  const polAvg=pol.reduce((a,b)=>a+b,0)/(GW*GH)*3;
  const actCars=cars.filter(c=>c.active).length;
  const trafficSat=roadCells.size>0?clamp(actCars/Math.max(10,roadCells.size*.16),0,1):0;
  let h=50;
  h+=Math.min(18,happyB/(1+state.pop/120));
  h+=cov.edu*9+cov.health*9+cov.sec*7;
  h-=unemp*20;
  h-=polAvg*.5;
  h-=trafficSat*6;
  h-=(state.tax-9)*1.2;
  h+=state.money<0?-12:state.money>5000?2:0;
  h+=(WEATHER_DEF[state.weather]?.happy||0)+(C.eventHappy||0);
  state.happy=clamp(Math.round(h),5,98);
  const greenSat=Math.min(1,green/(state.pop/28+6));
  state.qol=clamp(Math.round((cov.edu+cov.health+cov.sec)*60+greenSat*30+Math.min(1,cov.power)*10-polAvg*1.6-unemp*18),0,100);
  const demandR=clamp((jobs*1.15+55-cap)/120,-1,1);
  const demandC=clamp((state.pop/26-comJobs)/45,-1,1);
  const demandS=clamp((state.pop/55-counts.svc)/6,-1,1);
  const demandF=clamp((state.pop/50-counts.fun)/6,-1,1);
  let lvl=1;for(let i=LEVELS.length-1;i>=0;i--)if(state.pop>=LEVELS[i].min){lvl=i+1;break}
  const prevLevel=state.level;
  state.level=lvl;
  if(lvl>prevLevel)onLevelUp(lvl);
  Object.assign(C,{cap,jobs,inc,upk,tax,rev,exp,balance,counts,unemp,cov,polAvg,pol,trafficSat,demandR,demandC,demandS,demandF,green,actCars,cityHall,comJobs,labor,employed});
  applyEventMods();
  state.stats.maxPop=Math.max(state.stats.maxPop,state.pop);
  state.stats.maxMoney=Math.max(state.stats.maxMoney,state.money);
  state.stats.maxHappy=Math.max(state.stats.maxHappy,state.happy);
  updateHUD();updateMissionChip();checkMissions();checkAchievements();
  if(overlayMode)drawOverlay();
}
function popGrowth(){
  if(C.cap>state.pop&&C.demandR>0&&state.happy>45)
    state.pop=Math.min(C.cap,state.pop+1+Math.round(state.happy/30)+Math.round(3*Math.max(0,C.demandR)));
  else if(state.happy<38||C.unemp>.32)
    state.pop=Math.max(10,state.pop-2);
  for(let i=0;i<2;i++)tryGrowth();
  syncCitizens();
  recomputeCity();
}
function dayTick(){
  grownToday=0;
  for(let i=0;i<2;i++)tryGrowth();
  for(const b of state.buildings)b.age++;
  syncCitizens();
  recomputeCity();
  if(state.money<0)notify('warn','Tesouro negativo','Reduza despesas ou aumente impostos.','err');
  notify('sun','Dia '+state.day,'População: '+state.pop.toLocaleString('pt-BR')+' • Saldo: '+(C.balance>=0?'+':'')+fmt$(C.balance)+'/mês.');
  save();
}

let nextEvent=0;
function fireEvent(){
  const pool=[
    {w:3,run(){activeMods.push({happy:8,until:absHours()+8});notify('trophy','Festival da cidade','A felicidade está em alta por 8 horas.','gold')}},
    {w:3,run(){activeMods.push({incomeMul:1.35,until:absHours()+10});notify('store','Feira de bairro','O comércio rende 35% a mais por 10 horas.')}},
    {w:2,run(){state.money+=120;state.stats.earned+=120;updateHUD();notify('coin','Visitante ilustre','Um turista deixou $ 120 na cidade.','gold')}},
    {w:2,run(){for(let i=0;i<3;i++)tryGrowth();notify('home','Novas inaugurações','A cidade está atraindo novos moradores.')}},
    {w:2,run(){activeMods.push({incomeMul:.8,until:absHours()+8});notify('road','Obra pública','Uma obra reduz a renda temporariamente.','warn2')}},
    {w:2,run(){activeMods.push({speedMul:.65,traffic:1.5,until:absHours()+4});notify('road','Trânsito intenso','Os congestionamentos desaceleram a cidade.','warn2')}},
    {w:2,run(){
      if(C.cov.power<.5){lampOut=true;activeMods.push({incomeMul:.85,until:absHours()+5});
        notify('zap','Falta de energia','A rede está sobrecarregada — considere uma estação de energia.','err');
        setTimeout(()=>{lampOut=false},60000)}
      else notify('zap','Pico de energia','A rede aguentou bem o pico de consumo.')}},
    {w:2,run(){setWeather('storm',2);notify('storm','Chuva forte','Uma tempestade se aproxima.','warn2')}},
    {w:2,run(){setWeather('sun',4);activeMods.push({happy:-3,until:absHours()+6});notify('sun','Onda de calor','Beba água e use protetor solar.','warn2')}},
    {w:1,run(){state.pop=Math.min(C.cap,state.pop+Math.max(1,Math.round(state.pop*.03)));recomputeCity();notify('users','Aumento populacional','Notícias boas atraíram novas famílias.')}},
    {w:1,run(){
      if(state.buildings.length>8){
        const b=state.buildings[Math.floor(Math.random()*state.buildings.length)];
        if(B[b.type].road)return;
        const d=B[b.type];const[x,z]=CENTER(b.cx,b.cz,d.size[0],d.size[1],b.rot);
        fx.smoke(x,z,C.cov.sec>.5?6:14);
        const rc=nearestRoad(b.cx,b.cz);
        if(rc)dispatchEmergency('firetruck',rc);
        activeMods.push({happy:C.cov.sec>.5?-1:-3,until:absHours()+4});
        notify('warn','Pequeno incêndio',C.cov.sec>.5?'Os bombeiros controlaram rapidamente.':'Sem cobertura de bombeiros, os danos foram maiores.','err');
      }}},
    {w:1,run(){
      if(C.cov.health<.9&&state.buildings.length>6){
        const nodes=roadNodes();
        if(nodes.length){dispatchEmergency('ambulance',nodes[Math.floor(Math.random()*nodes.length)]);
          notify('health','Emergência médica','Uma ambulância foi despachada. A saúde da cidade precisa de atenção.','warn2')}
      }}},
    {w:2,run(){activeMods.push({happy:7,until:absHours()+8});notify('star','Desfile cívico','Bandas e cores pelas ruas — a cidade comemora.','gold')}},
    {w:2,run(){activeMods.push({incomeMul:1.28,traffic:.7,until:absHours()+6});notify('store','Semana do teatro','A cultura enche os caixas e esvazia o trânsito.')}},
    {w:2,run(){activeMods.push({happy:4,traffic:.55,until:absHours()+5});notify('road','Dia sem carros','Ruas mais limpas e silenciosas: a felicidade sobe.','gold')}},
    {w:2,run(){const bonus=Math.round(60+state.pop*2.5);state.money+=bonus;state.stats.earned+=bonus;updateHUD();
      notify('trophy','Verba estadual','A capital recebeu '+fmt$(bonus)+' de incentivo ao turismo.','gold')}},
    {w:1,run(){if(state.buildings.length>10){setWeather('fog',2);
      activeMods.push({happy:-2,traffic:1.3,until:absHours()+5});
      notify('fog','Neblina densa','A visibilidade caiu e o trânsito anda devagar.','warn2')}}},
  ];
  const total=pool.reduce((a,e)=>a+e.w,0);
  let r=Math.random()*total;
  for(const e of pool){r-=e.w;if(r<=0){e.run();break}}
  applyEventMods();
}
function updateEvents(){
  const now=absHours();
  for(let i=activeMods.length-1;i>=0;i--)if(activeMods[i].until<=now)activeMods.splice(i,1);
  if(now>=nextEvent){fireEvent();nextEvent=now+3+Math.random()*3}
}

const fx=(()=>{
  const sprites=[];
  for(let i=0;i<44;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,opacity:0,depthWrite:false}));
    s.visible=false;fxGroup.add(s);
    sprites.push({s,life:0,max:1,vx:0,vy:0,vz:0,s0:1,s1:1,smoke:false});
  }
  const rings=[];
  for(let i=0;i<6;i++){
    const r=new THREE.Mesh(GEO('ring',()=>new THREE.TorusGeometry(.6,.07,6,20)),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0}));
    r.rotation.x=-Math.PI/2;r.visible=false;fxGroup.add(r);
    rings.push({r,life:0});
  }
  function puff(x,y,z,col,s1,vy,smoke){
    const p=sprites.find(q=>q.life<=0);if(!p)return;
    p.life=p.max=smoke?1.6:.7;p.smoke=smoke;
    p.s.position.set(x,y,z);p.s.visible=true;
    p.s.material.color.set(col);p.s.material.opacity=.8;
    p.vx=(Math.random()-.5)*1.2;p.vy=vy;p.vz=(Math.random()-.5)*1.2;
    p.s0=.3;p.s1=s1;
  }
  return{
    dust(x,z){
      if(!state.settings.particles)return;
      for(let i=0;i<5;i++)puff(x+(Math.random()-.5),.4,z+(Math.random()-.5),0xd9cdb5,1.2+Math.random(),1.6,false);
      const rg=rings.find(r=>r.life<=0);
      if(rg){rg.life=.55;rg.r.visible=true;rg.r.position.set(x,.12,z);rg.r.material.color.set(0xfff2cc);rg.r.scale.setScalar(.4)}
    },
    smoke(x,z,dur){
      if(!state.settings.particles)return;
      let n=0;
      const iv=setInterval(()=>{puff(x+(Math.random()-.5)*.8,2+Math.random(),z+(Math.random()-.5)*.8,0x5a5a5a,2.2,1.4,true);if(++n>dur*2)clearInterval(iv)},500);
    },
    confetti(){
      if(!state.settings.particles)return;
      const cols=[0xe2844f,0xd9a53c,0x6fb87a,0x6aa3d9,0xc96fa0];
      for(let i=0;i<16;i++)puff((Math.random()-.5)*8,6+Math.random()*3,(Math.random()-.5)*8,cols[i%5],.8,.5,false);
    },
    error(g){
      if(!g||!state.settings.particles)return;
      const x=g.position.x,z=g.position.z;
      for(let i=0;i<3;i++)puff(x+(Math.random()-.5),.4,z+(Math.random()-.5),0xff8d8d,.9,1.2,false);
    },
    update(dt){
      for(const p of sprites){
        if(p.life<=0)continue;
        p.life-=dt;
        const f=1-p.life/p.max;
        p.s.position.x+=p.vx*dt;p.s.position.y+=p.vy*dt*(p.smoke?.6:1);p.s.position.z+=p.vz*dt;
        p.s.scale.setScalar(lerp(p.s0,p.s1,f));
        p.s.material.opacity=(p.smoke?.5:.8)*(1-f);
        if(p.life<=0){p.s.visible=false;p.s.material.opacity=0}
      }
      for(const r of rings){
        if(r.life<=0)continue;
        r.life-=dt;const f=1-r.life/.55;
        r.r.scale.setScalar(.4+f*2.4);r.r.material.opacity=.7*(1-f);
        if(r.life<=0)r.r.visible=false;
      }
    }
  };
})();

============================================================ */
const CHORDS=[
  {lo:[130.81,196.00],hi:[329.63,293.66],up:[523.25,659.25,587.33]},
  {lo:[110.00,164.81],hi:[261.63,220.00],up:[440.00,523.25,659.25]},
  {lo:[87.31,130.81],hi:[220.00,174.61],up:[440.00,523.25,587.33]},
  {lo:[98.00,146.83],hi:[246.94,196.00],up:[493.88,587.33,392.00]}];
const AudioSys={ctx:null,master:null,mgain:null,beat:0,chordT:0,ci:-1,chordDur:7,rainGain:null,
  init(){
    if(this.ctx)return;
    try{
      this.ctx=new(window.AudioContext||window.webkitAudioContext)();
      this.master=this.ctx.createGain();this.master.gain.value=state.settings.vol;
      this.master.connect(this.ctx.destination);
      this.mgain=this.ctx.createGain();this.mgain.gain.value=.14;this.mgain.connect(this.master);
      this.chordT=0;this.startAmb();
    }catch(e){}
  },
  startAmb(){   /* chuva: ruído suave filtrado em loop */
    if(!this.ctx||this.rainGain)return;
    try{
      const len=Math.floor(this.ctx.sampleRate*2);
      const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d=buf.getChannelData(0);
      let last=0;
      for(let i=0;i<len;i++){const w=Math.random()*2-1;last=last*.74+w*.26;d[i]=last*1.7}
      const src=this.ctx.createBufferSource();src.buffer=buf;src.loop=true;
      const flt=this.ctx.createBiquadFilter();flt.type='lowpass';flt.frequency.value=1700;
      const g=this.ctx.createGain();g.gain.value=0;
      src.connect(flt);flt.connect(g);g.connect(this.master);
      src.start();this.rainSrc=src;this.rainGain=g;
    }catch(e){}
  },
  setRain(v){
    if(!this.rainGain)return;
    const target=state.settings.sfx?clamp(v,0,1):0;
    this.rainGain.gain.value+=(target-this.rainGain.gain.value)*.08;
  },
  tone(f,dur,type='sine',vol=.5,slide=0){
    if(!this.ctx||!state.settings.sfx)return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(this.master);
    o.start(t);o.stop(t+dur+.05);
  },
  click(){this.tone(700,.05,'square',.12)},
  place(f){this.tone(f||520,.14,'sine',.3,260)},
  sell(){this.tone(420,.16,'sine',.25,-220)},
  err(){this.tone(140,.18,'sawtooth',.18)},
  bull(){this.tone(210,.24,'sawtooth',.22,-130);setTimeout(()=>this.tone(115,.18,'square',.13),70)},
  zone(){this.tone(1040,.05,'triangle',.1)},
  upgrade(){this.tone(600,.1,'sine',.25);setTimeout(()=>this.tone(860,.12,'sine',.25),90)},
  level(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,.16,'sine',.28),i*110))},
  notify(){this.tone(880,.09,'triangle',.12)},
  pluck(f,vol){
    if(!this.ctx)return;
    const t=this.ctx.currentTime;
    for(const det of[0,1.5]){
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type='sine';o.frequency.value=f+det;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(vol,t+.04);
      g.gain.exponentialRampToValueAtTime(.001,t+1.7);
      o.connect(g);g.connect(this.mgain);o.start(t);o.stop(t+1.8);
    }
  },
  playChord(night){
    if(!this.ctx)return;
    const dur=this.chordDur=night?9:7;
    this.ci=(this.ci+1)%CHORDS.length;
    const ch=CHORDS[this.ci],t=this.ctx.currentTime;
    const notes=ch.lo.concat(ch.hi);
    for(let i=0;i<notes.length;i++){
      const f=notes[i];
      for(const det of[0,1.4]){
        const o=this.ctx.createOscillator(),g=this.ctx.createGain();
        o.type=i<2?'sine':'triangle';o.frequency.value=f+det;
        const amp=(i<2?0.055:0.034)*(night?0.7:1);
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(amp,t+1.2);
        g.gain.linearRampToValueAtTime(0,t+dur+.5);
        o.connect(g);g.connect(this.mgain);
        o.start(t);o.stop(t+dur+.7);
      }
    }
    this.chordT=dur;
  },
  music(dt){
    if(!this.ctx)return;
    if(!state.settings.music){this.mgain.gain.value=0;return}
    if(this.mgain.gain.value!==0.14)this.mgain.gain.value=0.14;
    const night=state.t<6.2||state.t>=19;
    this.chordT-=dt;
    if(this.chordT<=0)this.playChord(night);
    this.beat-=dt;
    if(this.beat<=0){
      this.beat=night?2.8:1.6;
      if(Math.random()<(night?0.4:0.8)){
        const ch=CHORDS[this.ci<0?0:this.ci];
        const f=ch.up[Math.floor(Math.random()*ch.up.length)]*(Math.random()<0.35?0.5:1);
        this.pluck(f,night?0.05:0.075);
      }
    }
  },
  setVol(v){if(this.master)this.master.gain.value=v}
};
